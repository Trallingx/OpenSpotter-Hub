# =============================================================================
# Syringe Drive (manual stepper, no heater)
# =============================================================================
# Volume geometry:
#   Plunger diameter   = 0.5 mm
#   Cross-section area = pi x 0.25^2 = 0.19635 mm2
#   Leadscrew pitch    = 8 mm/rev  ->  1.571 uL per revolution
#   Full syringe       = 10 uL    ->  50.93 mm of leadscrew travel
#
# Steps:
#   200 steps/rev x 16 microsteps = 3200 steps/rev
#   rotation_distance = 8  (8 mm leadscrew travel per revolution)
#   -> 3200 steps per mm of leadscrew
#   -> 1 uL = 5.093 mm of E travel
#
# E position meaning:
#   E=0     -> syringe homed (plunger fully retracted = FULL, 10 uL available)
#   E=50.93 -> plunger fully depressed = EMPTY
# =============================================================================

[manual_stepper syringe]
step_pin: PC3
dir_pin: PL6
enable_pin: !PA4
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 8
velocity: 10
accel: 20
endstop_pin: ^!PB6                 # Plunger fully retracted = home
position_endstop: 50
position_min: 0
position_max: 70                   # Full syringe = ~51 mm travel

# =============================================================================
# Syringe Endstop
# Wired to X-min header (PB6)
# Triggers when plunger is fully retracted = syringe full = E home position
# =============================================================================

# =============================================================================
# Syringe Control Macros (manual_stepper based)
# =============================================================================

[gcode_macro ASPIRATE]
description: Aspirate in mm
gcode:
    {% set move_mm = params.MM|float %}
    {% set speed = params.SPEED|default(10.0)|float %}
    {% set relative = params.RELATIVE|default(0)|int %}
    {% set current = printer.save_variables.variables.syringe_pos_mm|default(0)|float %}

   
    {% set position_max = 50 %}

    
    {% if relative == 1 %}
        {% set pos_mm = current + move_mm %}
    {% else %}
        {% set pos_mm = move_mm %}
    {% endif %}

    {% if pos_mm >= position_max %}
        {% set pos_mm = position_max %}
    {% endif %}

    MANUAL_STEPPER STEPPER=syringe MOVE={pos_mm} SPEED={speed}
    
    SAVE_VARIABLE VARIABLE=syringe_pos_mm VALUE={pos_mm}
    
    RESPOND MSG="Move({move_mm|round(4)}mm to {pos_mm})"

[gcode_macro DISPENSE]
description: Dispense in mm
gcode:
    {% set move_mm = params.MM|float %}
    {% set speed = params.SPEED|default(10.0)|float %}
    {% set relative = params.RELATIVE|default(0)|int %}
    {% set current = printer.save_variables.variables.syringe_pos_mm|default(0)|float %}


    {% set position_min = 0 %}

      
    {% if relative == 1 %}
        {% set pos_mm = current - move_mm %}
    {% else %}
        {% set pos_mm = move_mm %}
    {% endif %}

    {% if pos_mm <= position_min %}
        {% set pos_mm = position_min %}
    {% endif %}
    
    MANUAL_STEPPER STEPPER=syringe MOVE={pos_mm} SPEED={speed}
    
    SAVE_VARIABLE VARIABLE=syringe_pos_mm VALUE={pos_mm}
    
    RESPOND MSG="Move({-move_mm|round(4)}mm to {pos_mm})"

[gcode_macro HOME_SYRINGE]
description: Home syringe stepper to endstop — plunger fully retracted = full
gcode:
	RESPOND MSG="Homing syringe to full position..."
	MANUAL_STEPPER STEPPER=syringe ENABLE=0 SPEED=10 SET_POSITION=0 MOVE=60 STOP_ON_ENDSTOP=1
	MANUAL_STEPPER STEPPER=syringe SET_POSITION=50
	SAVE_VARIABLE VARIABLE=syringe_pos_mm VALUE=50
	M117 Syringe full (10uL)
	RESPOND MSG="Syringe homed. Pos=50mm = 10uL."

[gcode_macro WAIT]
description: Wait helper. Usage: WAIT S=<seconds> or WAIT MS=<milliseconds>
gcode:
    {% set sec = params.S|default(none) %}
    {% set ms = params.MS|default(none) %}
    {% if ms is not none %}
        {% set wait_ms = ms|int %}
    {% elif sec is not none %}
        {% set wait_ms = (sec|float * 1000)|int %}
    {% else %}
        {% set wait_ms = 1000 %}
    {% endif %}
    G4 P{wait_ms}

# =============================================================================
# Syringe Increment Controls (for Mainsail buttons)
# =============================================================================

[gcode_macro SYRINGE_DISPENSE_10]
description: Dispense 10 uL
gcode:
	DISPENSE MM=50 RELATIVE=1

[gcode_macro SYRINGE_DISPENSE_1]
description: Dispense 1 uL
gcode:
	DISPENSE MM=5 RELATIVE=1

[gcode_macro SYRINGE_DISPENSE_01]
description: Dispense 0.1 uL
gcode:
	DISPENSE MM=0.5 RELATIVE=1

[gcode_macro SYRINGE_RETRACT_01]
description: Retract 0.1 uL
gcode:
	RETRACT_SYRINGE MM=0.5 RELATIVE=1

[gcode_macro SYRINGE_RETRACT_1]
description: Retract 1 uL
gcode:
	RETRACT_SYRINGE MM=5 RELATIVE=1

[gcode_macro SYRINGE_RETRACT_10]
description: Retract 10 uL
gcode:
	RETRACT_SYRINGE MM=50 RELATIVE=1
