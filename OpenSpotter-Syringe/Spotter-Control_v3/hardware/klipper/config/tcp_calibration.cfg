# =============================================================================
# TCP Optical Cross Calibration
# OGLW2-40T-2PS6, NPN active-low outputs
# =============================================================================
#
# This config uses the custom Klipper module:
#   klippy/extras/tcp_calibration.py
#
# It replaces the old delayed_gcode polling routine with continuous homing-style
# moves that stop on MCU endstop transitions from the optical beams.
#
# Motion model:
#   The custom Python module does not move in a circle. Klipper's endstop
#   homing path can only watch straight moves, so calibration is split into a
#   few continuous straight moves.
#
#   Before running TCPCALIBRATE, jog the needle so the tip is clear and on the
#   chosen right/start side of the optical cross. The command uses the
#   current XY position as that start point. It first moves only in X
#   (default: decreasing X) until the X beam is hit.
#
#   After the first X-beam crossing, the module centers X with a diagonal sweep
#   normal to the beam, then steps upward in Z. It repeats that orthogonal sweep
#   at every Z step so a bent or thin needle remains centered. After the first
#   missed sweep, it halves downward to find the X tip edge within Z_TOLERANCE.
#
#   It then moves to tip Z minus 2 mm and measures both beam coordinates in that
#   common plane. X is re-centered normal to its beam. From that point, the
#   module follows the physical X beam, which crosses Y almost orthogonally,
#   and averages both Y edges without changing the X coordinate. It solves the
#   beam intersection, moves there, and queries X then Y without movement.
#   Calibration becomes ready only when both stationary states are PRESSED.
#
# Debugging:
#   If calibration reports no trigger during the initial X sweep, run
#   TCPQUERYBEAMS and manually block each beam to verify it changes to PRESSED.
#   If the beam states are correct, increase X_SWEEP_TRAVEL or start closer to
#   the optical cross. If tip tracking loses X too early, increase XY_TRAVEL or
#   reduce Z_STEP. If X is still found at the top, increase Z_TRAVEL. If final
#   verification fails, check beam normals, XY_TRAVEL, and Y_SWEEP_TRAVEL.
#
# BLTouch safety:
#   TCPSTART and TCPCALIBRATE are blocked unless the saved BLTouch dock state
#   says parked. TCPSTART performs this guard before any positioning move.
#   PARK_BLTOUCH saves:
#     bltouch_state = 'parked'
#     bltouch_parked = True
#   LOAD_BLTOUCH saves:
#     bltouch_state = 'loaded'
#     bltouch_parked = False
#   Use TCPQUERYBLTOUCH to see the saved state used by this guard.
#
# TCP power safety:
#   TCPCALIBRATE is blocked unless tcp_power_on=True in save_variables.
#   TCPON / TCPOFF maintain that saved state. TCPINIT resets it to False after
#   each Klipper restart because x13_switch defaults to value=0 at startup.
#
# Usage:
#   TCPCALIBRATE X=<expected_tip_x> Y=<expected_tip_y> Z=<expected_tip_z> HEIGHT=<z>
#   TCPSTART X=<start_right_x> Y=<start_right_y> Z=<start_z> HEIGHT=<z>
#            CALX=<expected_cross_x> CALY=<expected_cross_y> CALZ=<expected_z>
#   TCPABORT [EMERGENCY=1]
#
#   TCPCALIBRATE X/Y/Z are the expected final needle tip position at the cross.
#   TCPSTART X/Y/Z are the clear right/start position. TCPSTART raises to LIFTZ,
#   moves Y, moves X, lowers to Z, then starts calibration from there.
#
#   If the right/start position is not the expected final cross position, pass
#   CALX/CALY/CALZ to TCPSTART. Those are forwarded to TCPCALIBRATE for offset
#   calculation. If CALX/CALY/CALZ are omitted, TCPSTART uses X/Y/Z for backward
#   compatibility.
#
# Common optional parameters:
#   X_DIRECTION=-1   Initial acquisition direction; -1 means X decreases
#   Y_DIRECTION=-1   First diagonal side to try while following the X beam
#   X_SWEEP_TRAVEL=10.0
#                    Max pure-X distance used to find the X beam
#   Y_SWEEP_TRAVEL=10.0
#                    Max diagonal distance along X used to find the Y beam
#   Z_STEP=2.0       Z increment between beam-following sweeps
#   Z_TOLERANCE=0.01
#                    Final half-step tolerance for the X tip edge
#   RADIUS=3.0       Alias for XY_TRAVEL; local half-distance around a found
#                    beam edge for bidirectional centering
#   XY_TRAVEL=3.0    Same as RADIUS when RADIUS is not supplied
#   PASSES=2         Alias for XY_PASSES; bidirectional XY samples per beam
#   XY_PASSES=2      Same as PASSES when PASSES is not supplied
#   SPEED=20.0       XY acquisition and centering speed in mm/s
#   Z_SPEED=5.0      Z step speed in mm/s
#   Z_TRAVEL=20.0    Max upward beam-following search from HEIGHT
#
# Saved values:
#   tcp_tip_x, tcp_tip_y, tcp_tip_z
#   tcp_offset_x, tcp_offset_y, tcp_offset_z
#   tcp_coordinate_version, tcp_power_on, tcp_ready
# =============================================================================

[output_pin x13_switch]
pin: PE5
value: 0
shutdown_value: 0

[delayed_gcode TCPINIT]
initial_duration: 1.0
gcode:
    SAVE_VARIABLE VARIABLE=tcp_power_on VALUE=False

[gcode_macro TCPON]
gcode:
    SET_PIN PIN=x13_switch VALUE=1
    M400
    SAVE_VARIABLE VARIABLE=tcp_power_on VALUE=True
    RESPOND MSG="TCP sensor output is on."

[gcode_macro TCPOFF]
gcode:
    SET_PIN PIN=x13_switch VALUE=0
    M400
    SAVE_VARIABLE VARIABLE=tcp_power_on VALUE=False
    RESPOND MSG="TCP sensor output is off."

[gcode_macro TCPSTART]
description: Move to TCP right/start position, then run TCP calibration.
gcode:
    {% if params.X is not defined or params.Y is not defined or params.Z is not defined %}
        {action_raise_error("TCPSTART requires X=<start_x> Y=<start_y> Z=<start_z>")}
    {% endif %}
    {% set svv = printer.save_variables.variables %}
    {% set bltouch_state = svv.bltouch_state|default('unknown')|string|lower %}
    {% set bltouch_parked = svv.bltouch_parked|default(false) %}
    {% if bltouch_state != 'parked' or bltouch_parked != true %}
        {action_raise_error("TCPSTART blocked: saved BLTouch state is " ~ bltouch_state ~ " parked=" ~ bltouch_parked ~ ". Physically verify the probe, then run SET_BLTOUCH_DOCK_STATE STATE=parked, or PARK_BLTOUCH if it is loaded.")}
    {% endif %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set z = params.Z|float %}
    {% set cal_x = params.CALX|default(x)|float %}
    {% set cal_y = params.CALY|default(y)|float %}
    {% set cal_z = params.CALZ|default(z)|float %}
    {% set height = params.HEIGHT|default(z)|float %}
    {% set lift_z = params.LIFTZ|default(50.0)|float %}
    {% set xy_feed = params.XYF|default(8000)|float %}
    {% set z_feed = params.ZF|default(2500)|float %}
    G90
    G0 Z{lift_z} F{z_feed}
    G0 Y{y} F{xy_feed}
    G0 X{x} F{xy_feed}
    G0 Z{z} F{z_feed}
    TCPON
    TCPCALIBRATE X={cal_x} Y={cal_y} Z={cal_z} HEIGHT={height}{% if params.RADIUS is defined %} RADIUS={params.RADIUS}{% endif %}{% if params.XY_TRAVEL is defined %} XY_TRAVEL={params.XY_TRAVEL}{% endif %}{% if params.PASSES is defined %} PASSES={params.PASSES}{% endif %}{% if params.XY_PASSES is defined %} XY_PASSES={params.XY_PASSES}{% endif %}{% if params.SPEED is defined %} SPEED={params.SPEED}{% endif %}{% if params.X_DIRECTION is defined %} X_DIRECTION={params.X_DIRECTION}{% endif %}{% if params.Y_DIRECTION is defined %} Y_DIRECTION={params.Y_DIRECTION}{% endif %}{% if params.X_SWEEP_TRAVEL is defined %} X_SWEEP_TRAVEL={params.X_SWEEP_TRAVEL}{% endif %}{% if params.Y_SWEEP_TRAVEL is defined %} Y_SWEEP_TRAVEL={params.Y_SWEEP_TRAVEL}{% endif %}{% if params.Z_STEP is defined %} Z_STEP={params.Z_STEP}{% endif %}{% if params.Z_TOLERANCE is defined %} Z_TOLERANCE={params.Z_TOLERANCE}{% endif %}{% if params.Z_SPEED is defined %} Z_SPEED={params.Z_SPEED}{% endif %}{% if params.Z_TRAVEL is defined %} Z_TRAVEL={params.Z_TRAVEL}{% endif %}
    TCPOFF

[gcode_macro TCPABORT]
description: Abort/cleanup TCP calibration state. Use EMERGENCY=1 for immediate shutdown.
gcode:
    TCPOFF
    SAVE_VARIABLE VARIABLE=tcp_ready VALUE=False
    {% if params.EMERGENCY|default(0)|int == 1 %}
        M112
    {% else %}
        RESPOND MSG="TCP calibration aborted/cleaned up. TCP output is off and tcp_ready=False."
    {% endif %}

[tcp_calibration]
# Electrical assumption:
#   open circuit = beam clear
#   output pulled to ground = beam disrupted
# Therefore the inputs use pull-up + inverted logic (^!), so triggered means
# the beam is disrupted.
x_pin: ^!PH0
y_pin: ^!PK0

# TCPSTART checks the detachable BLTouch saved dock state before any movement.
# The Python module repeats that guard for direct TCPCALIBRATE calls.

# Defaults preserve the physical 45-degree optical cross after reflecting the
# machine Y basis so positive Y points down in the top view.
#
# Important:
#   These values are beam normals, not the physical beam-line directions.
#   The physical X beam rises toward X- and is perpendicular to x_beam_normal.
#   The physical Y beam rises toward X+ and is perpendicular to y_beam_normal.
#
#   x_beam_coord = ( x - y) / sqrt(2)
#   y_beam_coord = (-x - y) / sqrt(2)
x_beam_normal: 0.70710678118, -0.70710678118
y_beam_normal: -0.70710678118, -0.70710678118

# X_DIRECTION, Y_DIRECTION, X_SWEEP_TRAVEL, and Y_SWEEP_TRAVEL are also
# supported as command parameters for tuning the acquisition moves.
x_direction: -1
y_direction: -1

# Local half-distance for diagonal X centering and same-plane Y centering.
xy_travel: 3

# Bidirectional samples per beam. Higher values average more noise but increase
# calibration time.
xy_passes: 2

# Speeds are in mm/s because the Python module calls Klipper's manual_move /
# manual_home APIs directly, not G-code feedrates in mm/min.
speed: 20
z_speed: 5

# Z increment between beam-following sweeps.
z_step: 2

# Final half-step tolerance when refining from a missed beam back down to the
# last beam hit. 0.01 mm is 10 um.
z_tolerance: 0.01

# HEIGHT is the low absolute Z start. Z_TRAVEL is the maximum upward X-tip
# search distance.
z_travel: 20
