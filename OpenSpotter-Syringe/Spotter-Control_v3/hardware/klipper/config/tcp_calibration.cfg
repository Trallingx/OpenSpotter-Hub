# =============================================================================
# TCP Optical Cross Calibration
# OGLW2-40T-2PS6, NPN active-low outputs
# =============================================================================
#
# This config uses the custom Klipper module:
#   klippy/extras/tcp_calibration.py
#
# It replaces the old delayed_gcode polling routine with continuous homing-style
# moves that stop on MCU endstop transitions from the optical beams.
#
# Motion model:
#   The custom Python module does not move in a circle. Klipper's endstop
#   homing path can only watch straight moves, so calibration is split into a
#   few continuous straight moves.
#
#   Before running TCPCALIBRATE, jog the needle so the tip is clear and on the
#   chosen left/start side of the 45-degree optical cross. The command uses the
#   current XY position as that start point. It first moves only in X
#   (default: decreasing X) until either the X or Y beam is hit.
#
#   After the first beam is found, the module locally scans that beam from both
#   sides to find its center. Then it follows the physical 45-degree line of
#   that first beam toward the expected cross position until the other beam is
#   hit. It locally scans the second beam from both sides, solves the XY cross
#   from the two beam coordinates, then performs the Z/HEIGHT calibration.
#
# Debugging:
#   If calibration reports no trigger during the initial X sweep, run
#   TCPQUERYBEAMS and manually block each beam to verify it changes to PRESSED.
#   If the beam states are correct, increase X_SWEEP_TRAVEL or start closer to
#   the optical cross. If local centering fails after a beam was found,
#   increase XY_TRAVEL.
#
# BLTouch safety:
#   TCPCALIBRATE is blocked unless the saved BLTouch dock state says parked.
#   PARK_BLTOUCH saves:
#     bltouch_state = 'parked'
#     bltouch_parked = True
#   LOAD_BLTOUCH saves:
#     bltouch_state = 'loaded'
#     bltouch_parked = False
#   Use TCPQUERYBLTOUCH to see the saved state used by this guard.
#
# TCP power safety:
#   TCPCALIBRATE is blocked unless tcp_power_on=True in save_variables.
#   TCPON / TCPOFF maintain that saved state. TCPINIT resets it to False after
#   each Klipper restart because x13_switch defaults to value=0 at startup.
#
# Usage:
#   TCPCALIBRATE X=<expected_tip_x> Y=<expected_tip_y> Z=<expected_tip_z> HEIGHT=<z>
#   TCPSTART X=<start_left_x> Y=<start_left_y> Z=<start_z> HEIGHT=<z>
#            CALX=<expected_cross_x> CALY=<expected_cross_y> CALZ=<expected_z>
#   TCPABORT [EMERGENCY=1]
#
#   TCPCALIBRATE X/Y/Z are the expected final needle tip position at the cross.
#   TCPSTART X/Y/Z are the clear left/start position. TCPSTART raises to LIFTZ,
#   moves Y, moves X, lowers to Z, then starts calibration from there.
#
#   If the left/start position is not the expected final cross position, pass
#   CALX/CALY/CALZ to TCPSTART. Those are forwarded to TCPCALIBRATE for offset
#   calculation. If CALX/CALY/CALZ are omitted, TCPSTART uses X/Y/Z for backward
#   compatibility.
#
#   The first continuous acquisition sweep can only watch one beam at a time.
#   FIRSTBEAM=AUTO predicts X or Y from CALX/CALY and the start point. If AUTO
#   can not determine a beam, use FIRSTBEAM=X or FIRSTBEAM=Y.
#
# Common optional parameters:
#   X_DIRECTION=-1   Initial acquisition direction; -1 means X decreases
#   FIRSTBEAM=AUTO   X, Y, or AUTO for the initial acquisition sweep
#   X_SWEEP_TRAVEL=10.0
#                    Max pure-X distance used to find the first beam
#   CROSS_SEARCH_TRAVEL=10.0
#                    Min distance to follow the first 45-degree beam while
#                    searching for the other beam
#   RADIUS=2.0       Alias for XY_TRAVEL; local half-distance around a found
#                    beam edge for bidirectional centering
#   XY_TRAVEL=2.0    Same as RADIUS when RADIUS is not supplied
#   PASSES=2         Alias for XY_PASSES; bidirectional XY samples per beam
#   XY_PASSES=2      Same as PASSES when PASSES is not supplied
#   SPEED=5.0        XY acquisition and centering speed in mm/s
#   Z_PASSES=3       Z edge samples per selected beam
#   Z_SPEED=1.0      Z scan speed in mm/s
#   Z_TRAVEL=4.0     Search distance above/below HEIGHT
#   Z_BEAM=BOTH      X, Y, or BOTH
#
# Saved values:
#   tcp_tip_x, tcp_tip_y, tcp_tip_z
#   tcp_offset_x, tcp_offset_y, tcp_offset_z
#   tcp_power_on, tcp_ready
# =============================================================================

[output_pin x13_switch]
pin: PE5
value: 0
shutdown_value: 0

[delayed_gcode TCPINIT]
initial_duration: 1.0
gcode:
    SAVE_VARIABLE VARIABLE=tcp_power_on VALUE=False

[gcode_macro TCPON]
gcode:
    SET_PIN PIN=x13_switch VALUE=1
    M400
    SAVE_VARIABLE VARIABLE=tcp_power_on VALUE=True
    RESPOND MSG="TCP sensor output is on."

[gcode_macro TCPOFF]
gcode:
    SET_PIN PIN=x13_switch VALUE=0
    M400
    SAVE_VARIABLE VARIABLE=tcp_power_on VALUE=False
    RESPOND MSG="TCP sensor output is off."

[gcode_macro TCPSTART]
description: Move to TCP left/start position, then run TCP calibration.
gcode:
    {% if params.X is not defined or params.Y is not defined or params.Z is not defined %}
        {action_raise_error("TCPSTART requires X=<start_left_x> Y=<start_left_y> Z=<start_z>")}
    {% endif %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set z = params.Z|float %}
    {% set cal_x = params.CALX|default(x)|float %}
    {% set cal_y = params.CALY|default(y)|float %}
    {% set cal_z = params.CALZ|default(z)|float %}
    {% set height = params.HEIGHT|default(z)|float %}
    {% set lift_z = params.LIFTZ|default(50.0)|float %}
    {% set xy_feed = params.XYF|default(8000)|float %}
    {% set z_feed = params.ZF|default(2500)|float %}
    {% set first_beam = params.FIRSTBEAM|default(params.FIRST_BEAM|default('AUTO'))|string|upper %}
    {% if first_beam == 'AUTO' and (params.CALX is not defined or params.CALY is not defined) %}
        {action_raise_error("TCPSTART FIRSTBEAM=AUTO requires CALX=<expected_cross_x> and CALY=<expected_cross_y>. Or force FIRSTBEAM=X / FIRSTBEAM=Y.")}
    {% endif %}

    G90
    G0 Z{lift_z} F{z_feed}
    G0 Y{y} F{xy_feed}
    G0 X{x} F{xy_feed}
    G0 Z{z} F{z_feed}
    TCPON
    TCPCALIBRATE X={cal_x} Y={cal_y} Z={cal_z} HEIGHT={height}{% if params.RADIUS is defined %} RADIUS={params.RADIUS}{% endif %}{% if params.XY_TRAVEL is defined %} XY_TRAVEL={params.XY_TRAVEL}{% endif %}{% if params.PASSES is defined %} PASSES={params.PASSES}{% endif %}{% if params.XY_PASSES is defined %} XY_PASSES={params.XY_PASSES}{% endif %}{% if params.SPEED is defined %} SPEED={params.SPEED}{% endif %}{% if params.X_DIRECTION is defined %} X_DIRECTION={params.X_DIRECTION}{% endif %}{% if params.FIRSTBEAM is defined %} FIRSTBEAM={params.FIRSTBEAM}{% endif %}{% if params.FIRST_BEAM is defined %} FIRST_BEAM={params.FIRST_BEAM}{% endif %}{% if params.X_SWEEP_TRAVEL is defined %} X_SWEEP_TRAVEL={params.X_SWEEP_TRAVEL}{% endif %}{% if params.CROSS_SEARCH_TRAVEL is defined %} CROSS_SEARCH_TRAVEL={params.CROSS_SEARCH_TRAVEL}{% endif %}{% if params.Z_SPEED is defined %} Z_SPEED={params.Z_SPEED}{% endif %}{% if params.Z_TRAVEL is defined %} Z_TRAVEL={params.Z_TRAVEL}{% endif %}{% if params.Z_PASSES is defined %} Z_PASSES={params.Z_PASSES}{% endif %}{% if params.Z_BEAM is defined %} Z_BEAM={params.Z_BEAM}{% endif %}
    TCPOFF

[gcode_macro TCPABORT]
description: Abort/cleanup TCP calibration state. Use EMERGENCY=1 for immediate shutdown.
gcode:
    TCPOFF
    SAVE_VARIABLE VARIABLE=tcp_ready VALUE=False
    {% if params.EMERGENCY|default(0)|int == 1 %}
        M112
    {% else %}
        RESPOND MSG="TCP calibration aborted/cleaned up. TCP output is off and tcp_ready=False."
    {% endif %}

[tcp_calibration]
# Electrical assumption:
#   open circuit = beam clear
#   output pulled to ground = beam disrupted
# Therefore the inputs use pull-up + inverted logic (^!), so triggered means
# the beam is disrupted.
x_pin: ^!PH0
y_pin: ^!PK0

# The updated Python module requires the detachable BLTouch to be physically
# parked by default. That check uses the saved dock state maintained by
# PARK_BLTOUCH / LOAD_BLTOUCH.

# Defaults match the old macro's 45-degree optical cross transform.
#
# Important:
#   These values are beam normals, not the physical beam-line directions.
#   The physical X beam line is perpendicular to x_beam_normal and sits at
#   +45 degrees in XY. The physical Y beam line is perpendicular to
#   y_beam_normal and sits at -45 degrees in XY.
#
#   x_beam_coord = (-x + y) / sqrt(2)
#   y_beam_coord = ( x + y) / sqrt(2)
x_beam_normal: -0.70710678118, 0.70710678118
y_beam_normal: 0.70710678118, 0.70710678118

# Newer tcp_calibration.py builds support X_DIRECTION, X_SWEEP_TRAVEL, and
# CROSS_SEARCH_TRAVEL as command parameters and have internal defaults for
# them. They are intentionally not listed as config keys here so older installed
# module copies do not halt Klipper during startup.

# Local half-distance for bidirectional beam-centering scans after a beam edge
# has already been found.
xy_travel: 2.0

# Bidirectional samples per beam. Higher values average more noise but increase
# calibration time.
xy_passes: 2

# Speeds are in mm/s because the Python module calls Klipper's manual_move /
# manual_home APIs directly, not G-code feedrates in mm/min.
speed: 5.0
z_speed: 1.0

# HEIGHT is an absolute Z command input. Z_TRAVEL searches this far above and
# below HEIGHT to find the vertical beam edges.
z_travel: 4.0
z_passes: 3
z_beam: both
