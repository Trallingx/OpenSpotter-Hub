# =============================================================================
# TCP Optical Cross Calibration
# OGLW2-40T-2PS6, NPN active-low outputs
# =============================================================================
#
# Include from printer.cfg when the TCP sensor is wired:
#   [include tcp_calibration.cfg]
#
# Electrical assumption:
#   open circuit = beam clear
#   output pulled to ground = beam disrupted
# Therefore the inputs use pull-up + inverted logic (^!), so PRESSED means
# the beam is disrupted.
#
# Starter Einsy RAMBo EXT P3 pins:
#   tcp_beam_x -> PJ5
#   tcp_beam_y -> PK0
#
# Usage:
#   TCP_CALIBRATE X=<expected_x> Y=<expected_y> Z=<expected_z> HEIGHT=<z>
#
# Common optional parameters:
#   RADIUS=2.0       circle radius in mm
#   PASSES=4         number of circle revolutions
#   SPEED=5.0        XY sampling speed in mm/s
#   Z_STEP=0.02      Z search increment in mm
#   Z_PASSES=5       number of up/down Z edge samples
#   Z_SPEED=1.0      Z search speed in mm/s
#   Z_TRAVEL=8.0     maximum Z travel from HEIGHT during Z search
#
# The final values are saved by Klipper SAVE_VARIABLE in the active
# [save_variables] file:
#   tcp_tip_x, tcp_tip_y, tcp_tip_z
#   tcp_offset_x, tcp_offset_y, tcp_offset_z
#
# Klipper supports one active [save_variables] section. This config therefore
# uses the existing save_variables backend from printer.cfg.
# =============================================================================

[gcode_button tcp_beam_x]
pin: ^!PJ5
debounce_delay: 0.001
press_gcode:
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=last_event VALUE="'tcp_beam_x_pressed'"
release_gcode:
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=last_event VALUE="'tcp_beam_x_released'"

[gcode_button tcp_beam_y]
pin: ^!PK0
debounce_delay: 0.001
press_gcode:
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=last_event VALUE="'tcp_beam_y_pressed'"
release_gcode:
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=last_event VALUE="'tcp_beam_y_released'"

[gcode_macro TCP_CAL_STATE]
description: Internal state for TCP calibration. Do not call directly.
variable_active: 0
variable_stage: "idle"
variable_last_event: "none"
variable_expected_x: 0.0
variable_expected_y: 0.0
variable_expected_z: 0.0
variable_height: 0.0
variable_radius: 2.0
variable_speed: 5.0
variable_z_step: 0.02
variable_z_speed: 1.0
variable_z_travel: 8.0
variable_z_passes: 5
variable_z_count: 0
variable_z_sum: 0.0
variable_z_down: 0.0
variable_z_moves: 0
variable_index: 0
variable_total: 0
variable_point_count: 64
variable_x_sum: 0.0
variable_y_sum: 0.0
variable_x_count: 0
variable_y_count: 0
variable_tip_x: 0.0
variable_tip_y: 0.0
variable_tip_z: 0.0
variable_offset_x: 0.0
variable_offset_y: 0.0
variable_offset_z: 0.0
variable_points: "1.000000,0.000000;0.995185,0.098017;0.980785,0.195090;0.956940,0.290285;0.923880,0.382683;0.881921,0.471397;0.831470,0.555570;0.773010,0.634393;0.707107,0.707107;0.634393,0.773010;0.555570,0.831470;0.471397,0.881921;0.382683,0.923880;0.290285,0.956940;0.195090,0.980785;0.098017,0.995185;0.000000,1.000000;-0.098017,0.995185;-0.195090,0.980785;-0.290285,0.956940;-0.382683,0.923880;-0.471397,0.881921;-0.555570,0.831470;-0.634393,0.773010;-0.707107,0.707107;-0.773010,0.634393;-0.831470,0.555570;-0.881921,0.471397;-0.923880,0.382683;-0.956940,0.290285;-0.980785,0.195090;-0.995185,0.098017;-1.000000,0.000000;-0.995185,-0.098017;-0.980785,-0.195090;-0.956940,-0.290285;-0.923880,-0.382683;-0.881921,-0.471397;-0.831470,-0.555570;-0.773010,-0.634393;-0.707107,-0.707107;-0.634393,-0.773010;-0.555570,-0.831470;-0.471397,-0.881921;-0.382683,-0.923880;-0.290285,-0.956940;-0.195090,-0.980785;-0.098017,-0.995185;0.000000,-1.000000;0.098017,-0.995185;0.195090,-0.980785;0.290285,-0.956940;0.382683,-0.923880;0.471397,-0.881921;0.555570,-0.831470;0.634393,-0.773010;0.707107,-0.707107;0.773010,-0.634393;0.831470,-0.555570;0.881921,-0.471397;0.923880,-0.382683;0.956940,-0.290285;0.980785,-0.195090;0.995185,-0.098017"
gcode:
    {% set s = printer["gcode_macro TCP_CAL_STATE"] %}
    RESPOND MSG="TCP state: stage={s.stage}, active={s.active}, X samples={s.x_count}, Y samples={s.y_count}, Z samples={s.z_count}"

[gcode_macro TCP_CALIBRATE]
description: Calibrate needle TCP using the optical cross. Args: X Y Z [HEIGHT RADIUS PASSES SPEED Z_STEP Z_PASSES Z_SPEED Z_TRAVEL]
gcode:
    {% set expected_x = params.X|float %}
    {% set expected_y = params.Y|float %}
    {% set expected_z = params.Z|float %}
    {% set height = params.HEIGHT|default(expected_z)|float %}
    {% set radius = params.RADIUS|default(2.0)|float %}
    {% set passes = params.PASSES|default(4)|int %}
    {% set speed = params.SPEED|default(5.0)|float %}
    {% set z_step = params.Z_STEP|default(0.02)|float %}
    {% set z_passes = params.Z_PASSES|default(5)|int %}
    {% set z_speed = params.Z_SPEED|default(1.0)|float %}
    {% set z_travel = params.Z_TRAVEL|default(8.0)|float %}
    {% set point_count = printer["gcode_macro TCP_CAL_STATE"].point_count|int %}
    {% if radius <= 0 %}
        {action_raise_error("TCP_CALIBRATE requires RADIUS > 0")}
    {% endif %}
    {% if passes < 1 %}
        {action_raise_error("TCP_CALIBRATE requires PASSES >= 1")}
    {% endif %}
    {% if z_step <= 0 %}
        {action_raise_error("TCP_CALIBRATE requires Z_STEP > 0")}
    {% endif %}
    {% if z_passes < 1 %}
        {action_raise_error("TCP_CALIBRATE requires Z_PASSES >= 1")}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'circle'"
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=expected_x VALUE={expected_x}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=expected_y VALUE={expected_y}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=expected_z VALUE={expected_z}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=height VALUE={height}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=radius VALUE={radius}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=speed VALUE={speed}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_step VALUE={z_step}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_speed VALUE={z_speed}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_travel VALUE={z_travel}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_passes VALUE={z_passes}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_count VALUE=0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_sum VALUE=0.0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_down VALUE=0.0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_moves VALUE=0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=index VALUE=0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=total VALUE={passes * point_count}
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=x_sum VALUE=0.0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=y_sum VALUE=0.0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=x_count VALUE=0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=y_count VALUE=0

    G90
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        RESPOND MSG="TCP: homing XYZ before calibration"
        G28
    {% endif %}
    RESPOND MSG="TCP: sampling XY circle at X={expected_x|round(4)} Y={expected_y|round(4)} Z={height|round(4)} R={radius|round(4)} passes={passes}"
    G1 Z{height} F{(z_speed * 60.0)|round(1)}
    G1 X{expected_x + radius} Y{expected_y} F{(speed * 60.0)|round(1)}
    M400
    UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.05

[delayed_gcode tcp_calibration_tick]
gcode:
    {% set s = printer["gcode_macro TCP_CAL_STATE"] %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set x_pressed = printer["gcode_button tcp_beam_x"].state == "PRESSED" %}
    {% set y_pressed = printer["gcode_button tcp_beam_y"].state == "PRESSED" %}
    {% set both_pressed = x_pressed and y_pressed %}
    {% set both_clear = (not x_pressed) and (not y_pressed) %}
    {% set speed_f = (s.speed|float * 60.0)|round(1) %}
    {% set z_f = (s.z_speed|float * 60.0)|round(1) %}
    {% set max_z_moves = ((s.z_travel|float / s.z_step|float)|round(0, 'ceil'))|int %}

    {% if s.active|int == 0 %}
        RESPOND MSG="TCP: calibration tick ignored; routine is not active"

    {% elif s.stage == "circle" %}
        {% set sqrt_half = 0.70710678118 %}
        {% set cx = ((-sqrt_half * pos.x) + (sqrt_half * pos.y))|float %}
        {% set cy = ((sqrt_half * pos.x) + (sqrt_half * pos.y))|float %}
        {% set next_index = s.index|int + 1 %}
        {% if x_pressed %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=x_sum VALUE={s.x_sum|float + cx}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=x_count VALUE={s.x_count|int + 1}
        {% endif %}
        {% if y_pressed %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=y_sum VALUE={s.y_sum|float + cy}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=y_count VALUE={s.y_count|int + 1}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=index VALUE={next_index}

        {% if next_index < s.total|int %}
            {% set point_index = next_index % (s.point_count|int) %}
            {% set point = s.points.split(';')[point_index].split(',') %}
            {% set nx = point[0]|float %}
            {% set ny = point[1]|float %}
            G1 X{s.expected_x|float + (s.radius|float * nx)} Y{s.expected_y|float + (s.radius|float * ny)} F{speed_f}
            M400
            UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.02
        {% else %}
            UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.02
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'finish_xy'"
        {% endif %}

    {% elif s.stage == "finish_xy" %}
        {% if s.x_count|int < 1 or s.y_count|int < 1 %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=active VALUE=0
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'failed'"
            {action_raise_error("TCP XY calibration failed: one or both beams were never disrupted. Lower SPEED, reduce RADIUS, increase PASSES, or check wiring.")}
        {% endif %}
        {% set sqrt_half = 0.70710678118 %}
        {% set c1 = (s.x_sum|float / s.x_count|int)|float %}
        {% set c2 = (s.y_sum|float / s.y_count|int)|float %}
        {% set tip_x = ((c2 - c1) / (2.0 * sqrt_half))|float %}
        {% set tip_y = ((c1 + c2) / (2.0 * sqrt_half))|float %}
        {% set off_x = tip_x - s.expected_x|float %}
        {% set off_y = tip_y - s.expected_y|float %}

        SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=tip_x VALUE={tip_x}
        SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=tip_y VALUE={tip_y}
        SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=offset_x VALUE={off_x}
        SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=offset_y VALUE={off_y}
        SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'z_seek_clear'"
        SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_moves VALUE=0
        SAVE_VARIABLE VARIABLE=tcp_tip_x VALUE={tip_x}
        SAVE_VARIABLE VARIABLE=tcp_tip_y VALUE={tip_y}
        SAVE_VARIABLE VARIABLE=tcp_offset_x VALUE={off_x}
        SAVE_VARIABLE VARIABLE=tcp_offset_y VALUE={off_y}
        RESPOND MSG="TCP: XY center X={tip_x|round(5)} Y={tip_y|round(5)} offset X={off_x|round(5)} Y={off_y|round(5)}"
        G1 X{tip_x} Y{tip_y} F{speed_f}
        G1 Z{s.height|float} F{z_f}
        M400
        UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.05

    {% elif s.stage == "z_seek_clear" %}
        {% if both_clear %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'z_seek_down'"
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_moves VALUE=0
            G1 Z{pos.z - s.z_step|float} F{z_f}
            M400
            UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.02
        {% elif s.z_moves|int >= max_z_moves %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=active VALUE=0
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'failed'"
            {action_raise_error("TCP Z calibration failed: beams did not clear while moving up. Check center, HEIGHT, and Z_TRAVEL.")}
        {% else %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_moves VALUE={s.z_moves|int + 1}
            G1 Z{pos.z + s.z_step|float} F{z_f}
            M400
            UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.02
        {% endif %}

    {% elif s.stage == "z_seek_down" %}
        {% if both_pressed %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_down VALUE={pos.z}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'z_seek_up'"
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_moves VALUE=0
            G1 Z{pos.z + s.z_step|float} F{z_f}
            M400
            UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.02
        {% elif s.z_moves|int >= max_z_moves %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=active VALUE=0
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'failed'"
            {action_raise_error("TCP Z calibration failed: beams were not disrupted while moving down. Check center, HEIGHT, and Z_TRAVEL.")}
        {% else %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_moves VALUE={s.z_moves|int + 1}
            G1 Z{pos.z - s.z_step|float} F{z_f}
            M400
            UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.02
        {% endif %}

    {% elif s.stage == "z_seek_up" %}
        {% if both_clear %}
            {% set edge_z = ((s.z_down|float + pos.z) / 2.0)|float %}
            {% set new_count = s.z_count|int + 1 %}
            {% set new_sum = s.z_sum|float + edge_z %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_count VALUE={new_count}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_sum VALUE={new_sum}
            RESPOND MSG="TCP: Z edge sample {new_count}/{s.z_passes|int} = {edge_z|round(5)}"
            {% if new_count >= s.z_passes|int %}
                {% set tip_z = (new_sum / new_count)|float %}
                {% set off_z = tip_z - s.expected_z|float %}
                SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=tip_z VALUE={tip_z}
                SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=offset_z VALUE={off_z}
                SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=active VALUE=0
                SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'done'"
                SAVE_VARIABLE VARIABLE=tcp_tip_z VALUE={tip_z}
                SAVE_VARIABLE VARIABLE=tcp_expected_x VALUE={s.expected_x|float}
                SAVE_VARIABLE VARIABLE=tcp_expected_y VALUE={s.expected_y|float}
                SAVE_VARIABLE VARIABLE=tcp_expected_z VALUE={s.expected_z|float}
                SAVE_VARIABLE VARIABLE=tcp_offset_z VALUE={off_z}
                SAVE_VARIABLE VARIABLE=tcp_ready VALUE=True
                RESPOND MSG="TCP: done. Tip X={s.tip_x|round(5)} Y={s.tip_y|round(5)} Z={tip_z|round(5)} offsets X={s.offset_x|round(5)} Y={s.offset_y|round(5)} Z={off_z|round(5)}"
            {% else %}
                SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'z_seek_down'"
                SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_moves VALUE=0
                G1 Z{pos.z - s.z_step|float} F{z_f}
                M400
                UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.02
            {% endif %}
        {% elif s.z_moves|int >= max_z_moves %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=active VALUE=0
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'failed'"
            {action_raise_error("TCP Z calibration failed: beams did not clear while moving up during edge averaging.")}
        {% else %}
            SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=z_moves VALUE={s.z_moves|int + 1}
            G1 Z{pos.z + s.z_step|float} F{z_f}
            M400
            UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0.02
        {% endif %}

    {% else %}
        SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=active VALUE=0
        RESPOND MSG="TCP: idle stage={s.stage}"
    {% endif %}

[gcode_macro TCP_ABORT]
description: Stop an active TCP calibration state machine.
gcode:
    UPDATE_DELAYED_GCODE ID=tcp_calibration_tick DURATION=0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=TCP_CAL_STATE VARIABLE=stage VALUE="'aborted'"
    RESPOND MSG="TCP: calibration aborted"

[gcode_macro TCP_QUERY_BEAMS]
description: Report current TCP beam states.
gcode:
    {% set x_state = printer["gcode_button tcp_beam_x"].state %}
    {% set y_state = printer["gcode_button tcp_beam_y"].state %}
    RESPOND MSG="TCP beams: X={x_state} Y={y_state} (PRESSED means beam disrupted)"

[gcode_macro TCP_SHOW_OFFSETS]
description: Report saved TCP tip coordinates and offsets.
gcode:
    {% set svv = printer.save_variables.variables %}
    RESPOND MSG="TCP saved: tip X={svv.tcp_tip_x|default('unset')} Y={svv.tcp_tip_y|default('unset')} Z={svv.tcp_tip_z|default('unset')} offsets X={svv.tcp_offset_x|default('unset')} Y={svv.tcp_offset_y|default('unset')} Z={svv.tcp_offset_z|default('unset')}"

[gcode_macro TCP_MOVE_WITH_OFFSET]
description: Move to a requested nominal XYZ plus saved TCP offsets. Args: X Y Z [F]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set x = params.X|float + svv.tcp_offset_x|default(0.0)|float %}
    {% set y = params.Y|float + svv.tcp_offset_y|default(0.0)|float %}
    {% set z = params.Z|float + svv.tcp_offset_z|default(0.0)|float %}
    {% set f = params.F|default(600)|float %}
    G90
    G1 X{x} Y{y} Z{z} F{f}
    RESPOND MSG="TCP move: nominal X={params.X} Y={params.Y} Z={params.Z}, corrected X={x|round(5)} Y={y|round(5)} Z={z|round(5)}"
