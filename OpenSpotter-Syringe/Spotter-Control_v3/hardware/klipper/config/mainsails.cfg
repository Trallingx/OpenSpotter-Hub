# Minimal Mainsail integration for the syringe platform.
#
# The pause/cancel wrappers are adapted from mainsail-config, distributed under
# GPL-3.0. Filament, extruder-temperature, layer-pause, and toolhead-parking
# helpers are intentionally omitted because this machine uses a manual syringe
# stepper and the desktop workflow owns its experiment lifecycle.

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[respond]
default_type: echo

[gcode_macro CANCEL_PRINT]
description: Cancel the active virtual-SD job
rename_existing: CANCEL_PRINT_BASE
gcode:
    OPENSPOTTER_JOB_CLEANUP
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the active job at its current position
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE

[gcode_macro RESUME]
description: Resume the paused job
rename_existing: RESUME_BASE
gcode:
    RESUME_BASE {rawparams}
