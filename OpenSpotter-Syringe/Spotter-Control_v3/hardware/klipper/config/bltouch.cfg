# =============================================================================
# BLTouch Auto-Leveling Probe
# Wiring (Einsy RAMBo headers):
#   Red    -> +5V
#   Brown  -> GND
#   Black  -> GND
#   White  -> PB5  (Y-min) — sensor_pin
#   Orange -> PB4  (Z-min) — control_pin / servo
# =============================================================================

[bltouch]
sensor_pin: ^PB5
control_pin: PB4
x_offset: 0.0                  
y_offset: 25     
Z_offset: 0
speed: 50
lift_speed: 10
samples: 1
sample_retract_dist: 3
samples_result: median
samples_tolerance: 0.050
samples_tolerance_retries: 3
pin_up_touch_mode_reports_triggered: False
stow_on_each_sample: False
probe_with_touch_mode: True


# These dock macros maintain the saved BLTouch state used by TCPCALIBRATE.
# They also prevent double-action mistakes:
#   LOAD_BLTOUCH is only allowed from saved state parked=True.
#   PARK_BLTOUCH is only allowed from saved state loaded/parked=False.
[gcode_macro LOAD_BLTOUCH]
description: Move to BL_Touch sensor station and take it up 
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set state = svv.bltouch_state|default('unknown')|string|lower %}
  {% set parked = svv.bltouch_parked|default(false) %}
  {% if state != 'parked' or parked != true %}
    {action_raise_error("LOAD_BLTOUCH blocked: saved BLTouch state is " ~ state ~ " parked=" ~ parked ~ ". It can only load from parked state.")}
  {% endif %}

   G90
   G0 Z50 F2500 
   G0 Y188 F8000 
   G0 X232 F8000
   G0 Y208 
   G0 Z11.5 F2500
   G0 Y188 F8000
   G0 Z50 F2500
     
  SAVE_VARIABLE VARIABLE=bltouch_state VALUE="'loaded'"
  SAVE_VARIABLE VARIABLE=bltouch_parked VALUE=False
  RESPOND MSG="BL-Touch Picked up"


[gcode_macro PARK_BLTOUCH]
description: Move to BL_Touch sensor station and park it 
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set state = svv.bltouch_state|default('unknown')|string|lower %}
  {% set parked = svv.bltouch_parked|default(false) %}
  {% if state != 'loaded' or parked != false %}
    {action_raise_error("PARK_BLTOUCH blocked: saved BLTouch state is " ~ state ~ " parked=" ~ parked ~ ". It can only park from loaded state.")}
  {% endif %}

   G90
   G0 Z50 F2500 
   G0 Y188 F8000
   G0 X232 F8000
   G0 Z11.5 F2500
   G0 Y208  F8000
   G0 Z50 F2500
   G0 Y188 F8000
      
  SAVE_VARIABLE VARIABLE=bltouch_state VALUE="'parked'"
  SAVE_VARIABLE VARIABLE=bltouch_parked VALUE=True
  RESPOND MSG="BL-Touch Parked"
