# WARNING: DO NOT EDIT THIS FILE UNLESS YOU KNOW WHAT YOU ARE DOING

[output_pin LCD_backlight_pin]
pin: PE3
pwm: True
hardware_pwm: True

value: 1      # 1% of backlight
shutdown_value: 1 # Back to full backlight (without PWM) on restart
cycle_time: 0.001 # Default 0.1s cycle time flickers as hell

[display]
lcd_type: hd44780
display_group: open_spotter_20x4
rs_pin: PD5
e_pin: PF7
d4_pin: PF5
d5_pin: PG4
d6_pin: PH7
d7_pin: PG3
encoder_pins: ^PJ1,^PJ2
click_pin: ^!PH6

[display_data open_spotter_20x4 position]
position: 0, 0
text:
  {% set pos = printer.gcode_move.gcode_position %}
  { "X%05.1f Y%05.1f Z%05.1f" % (pos.x, pos.y, pos.z) }

[display_data open_spotter_20x4 syringe_motion]
position: 1, 0
text:
  {% set svv = printer.save_variables.variables %}
  {% set syringe = svv.syringe_pos_mm|default(0)|float %}
  {% set syringe_fullness = [[syringe / 50.0, 0.0]|max, 1.0]|min %}
  { "Syr%05.1f %3.0f%%" % (syringe, syringe_fullness * 100.0) }

[display_data open_spotter_20x4 syringe_bar]
position: 1, 13
text:
  {% set svv = printer.save_variables.variables %}
  {% set syringe = svv.syringe_pos_mm|default(0)|float %}
  {% set syringe_fullness = [[syringe / 50.0, 0.0]|max, 1.0]|min %}
  { draw_progress_bar(1, 13, 7, syringe_fullness) }

[display_data open_spotter_20x4 print_progress]
position: 2, 0
text: { "{:>4.0%}".format(printer.display_status.progress) }

[display_data open_spotter_20x4 progress_bar]
position: 2, 5
text: { draw_progress_bar(2, 5, 7, printer.display_status.progress) }

[display_data open_spotter_20x4 printing_time]
position: 2, 13
text: { "%7s" % (render("_printing_time").strip(),) }

[display_data open_spotter_20x4 process_status]
position: 3, 0
text:
  {% if printer.display_status.message %}
    { "%-20.20s" % (printer.display_status.message,) }
  {% elif 'print_stats' in printer and printer.print_stats.filename %}
    { "%-20.20s" % (printer.print_stats.state ~ " " ~ printer.print_stats.filename,) }
  {% else %}
    {% set axes = printer.toolhead.homed_axes|default("-") %}
    { "%-20.20s" % ("State:" ~ printer.idle_timeout.state ~ " H:" ~ axes,) }
  {% endif %}
