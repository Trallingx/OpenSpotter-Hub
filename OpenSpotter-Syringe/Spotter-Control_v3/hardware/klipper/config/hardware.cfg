# =============================================================================
# Hardware Configuration - Stepper Motors + Servo
# Einsy RAMBo 1.2b Pin Assignments
# =============================================================================


# =============================================================================
# X AXIS
# =============================================================================
[stepper_x]
step_pin: PC0
dir_pin: !PL0
enable_pin: !PA7
microsteps: 16
rotation_distance: 32

# Sensorless homing via TMC2130 X-DIAG
endstop_pin: tmc2130_stepper_x:virtual_endstop

position_endstop: 0
position_min: -20
position_max: 255

homing_speed: 40
homing_retract_dist: 3

# =============================================================================
# TMC2130 Y
# =============================================================================
[tmc2130 stepper_y]
cs_pin: PG2
interpolate: True
run_current: 0.500
sense_resistor: 0.220
diag1_pin: !PK7

driver_iholddelay: 8
driver_tpowerdown: 0
driver_tbl: 2
driver_toff: 3
driver_hend: 1
driver_hstrt: 5
driver_pwm_freq: 2
driver_pwm_grad: 2
driver_pwm_ampl: 230
driver_pwm_autoscale: True

# Sensorless homing sensitivity.
# Increase if it hits the frame without triggering.
# Decrease if it false-triggers before reaching the end.
driver_sgt: 10


# =============================================================================
# Y AXIS
# =============================================================================
[stepper_y]
step_pin: PC1
dir_pin: PL1
enable_pin: !PA6
microsteps: 16
rotation_distance: 32

# Sensorless homing via TMC2130 Y-DIAG
endstop_pin: tmc2130_stepper_y:virtual_endstop

position_endstop: 0
position_min: -20
position_max: 220

homing_speed: 40
homing_retract_dist: 3

# =============================================================================
# TMC2130 X
# =============================================================================
[tmc2130 stepper_x]
cs_pin: PG0
interpolate: True
run_current: 0.450
sense_resistor: 0.220
diag1_pin: !PK2

driver_iholddelay: 8
driver_tpowerdown: 0
driver_tbl: 2
driver_toff: 3
driver_hend: 1
driver_hstrt: 5
driver_pwm_freq: 2
driver_pwm_grad: 2
driver_pwm_ampl: 230
driver_pwm_autoscale: True

# Sensorless homing sensitivity.
# Increase if it hits the frame without triggering.
# Decrease if it false-triggers before reaching the end.
driver_sgt: 20



# =============================================================================
# Z AXIS
# =============================================================================
[stepper_z]
step_pin: PC2
dir_pin: !PL2
enable_pin: !PA5
microsteps: 16
rotation_distance: 8

# Sensorless homing via TMC2130 Z-DIAG
endstop_pin: tmc2130_stepper_z:virtual_endstop

position_endstop: 104
position_max: 120
position_min: -25

homing_speed: 20
homing_retract_dist: 3

# =============================================================================
# TMC2130 Z
# =============================================================================
[tmc2130 stepper_z]
cs_pin: PK5
run_current: 0.600
sense_resistor: 0.220
diag1_pin: !PK6
interpolate: True

driver_iholddelay: 8
driver_tpowerdown: 0
driver_tbl: 2
driver_toff: 3
driver_hend: 1
driver_hstrt: 5
driver_pwm_freq: 2
driver_pwm_grad: 4
driver_pwm_ampl: 200
driver_pwm_autoscale: True

# Sensorless homing sensitivity.
# Increase if it hits the frame without triggering.
# Decrease if it false-triggers before reaching the end.
driver_sgt: 10


# =============================================================================
# SERVO
# =============================================================================
[servo my_servo]
pin: PJ5
maximum_servo_angle: 180
minimum_pulse_width: 0.0007
maximum_pulse_width: 0.0025
initial_angle: 120