# =============================================================================
# Hardware Configuration - Stepper Motors + Servo
# Einsy RAMBo 1.1a Pin Assignments
# =============================================================================


# =============================================================================
# X AXIS
# =============================================================================
[stepper_x]
step_pin: PC0
dir_pin: !PL0
enable_pin: !PA7
microsteps: 16
rotation_distance: 32

# Sensorless homing via TMC2130 X-DIAG
endstop_pin: tmc2130_stepper_x:virtual_endstop

position_endstop: 0
position_min: -20
position_max: 255

homing_speed: 40
# Sensorless homing must not perform Klipper's unreliable second home.
homing_retract_dist: 0

# =============================================================================
# Y AXIS
# =============================================================================
[stepper_y]
step_pin: PC1
# Positive Y points from the TCP toward the work area (down in the top view).
dir_pin: !PL1
enable_pin: !PA6
microsteps: 16
rotation_distance: 32

# Sensorless homing via TMC2130 Y-DIAG
endstop_pin: tmc2130_stepper_y:virtual_endstop

position_endstop: 0
position_min: -20
position_max: 220

homing_speed: 40
# Sensorless homing must not perform Klipper's unreliable second home.
homing_retract_dist: 0

# =============================================================================
# Z AXIS
# =============================================================================
[stepper_z]
step_pin: PC2
dir_pin: !PL2
enable_pin: !PA5
microsteps: 16
rotation_distance: 8

# Sensorless homing via TMC2130 Z-DIAG
endstop_pin: tmc2130_stepper_z:virtual_endstop

position_endstop: 104
position_max: 120
position_min: -25

homing_speed: 20
# Sensorless homing must not perform Klipper's unreliable second home.
homing_retract_dist: 0

# =============================================================================
# SERVO
# =============================================================================
[servo my_servo]
pin: PJ5
maximum_servo_angle: 180
minimum_pulse_width: 0.0007
maximum_pulse_width: 0.0025
initial_angle: 10