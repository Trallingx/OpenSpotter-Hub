# =============================================================================
# OpenSpotter remote-control contract
#
# This file owns application runtime state, cleanup, and guarded manual jogs.
# Homing is deliberately outside this file: the operator supplies one
# [gcode_macro HOMING], and OpenSpotter treats that macro as an opaque command.
# =============================================================================

[gcode_macro _OPENSPOTTER_RUNTIME]
description: Subscribed operator-prompt state for the OpenSpotter desktop application
variable_prompt: 0
gcode:
    OPENSPOTTER_RUNTIME_STATUS

[gcode_macro OPENSPOTTER_CONTRACT_V4]
description: Immutable advertised marker for the guarded OpenSpotter desktop contract v4
gcode:
    OPENSPOTTER_RUNTIME_STATUS

[gcode_macro OPENSPOTTER_SET_PROMPT]
description: Set the structured OpenSpotter operator prompt (0-99)
gcode:
    {% if params.PROMPT is not defined %}
        {action_raise_error("OPENSPOTTER_SET_PROMPT requires PROMPT=<0-99>")}
    {% endif %}
    {% set prompt = params.PROMPT|int %}
    {% if prompt < 0 or prompt > 99 %}
        {action_raise_error("OpenSpotter operator prompt must be between 0 and 99")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_OPENSPOTTER_RUNTIME VARIABLE=prompt VALUE={prompt}
    RESPOND MSG="OpenSpotter operator prompt={prompt}"

[gcode_macro OPENSPOTTER_RUNTIME_STATUS]
description: Report the structured OpenSpotter operator prompt
gcode:
    {% set runtime = printer['gcode_macro _OPENSPOTTER_RUNTIME'] %}
    RESPOND MSG="OpenSpotter remote contract=v4; operator prompt={runtime.prompt|int}"

[gcode_macro OPENSPOTTER_JOB_CLEANUP]
description: Non-motion cleanup shared by normal completion and cancellation
gcode:
    NEEDLE_TIP_OFFSETS_DISABLE
    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=_OPENSPOTTER_RUNTIME VARIABLE=prompt VALUE=0
    M117
    RESPOND MSG="OpenSpotter job cleanup complete"

[gcode_macro OPENSPOTTER_JOG]
description: Guarded relative jog. Args: AXIS=X|Y|Z DISTANCE=<mm> F=<mm/min>
variable_max_xy_distance: 25.0
variable_max_z_distance: 5.0
variable_min_feed: 30.0
variable_max_xy_feed: 6000.0
variable_max_z_feed: 1500.0
gcode:
    {% if params.AXIS is not defined or params.DISTANCE is not defined %}
        {action_raise_error("OPENSPOTTER_JOG requires AXIS=X|Y|Z and DISTANCE=<mm>")}
    {% endif %}
    {% set cfg = printer['gcode_macro OPENSPOTTER_JOG'] %}
    {% set axis = params.AXIS|string|upper %}
    {% set distance = params.DISTANCE|float %}
    {% set feed = params.F|default(600)|float %}
    {% set homed = printer.toolhead.homed_axes|string|lower %}
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set virtual_sd_active = printer.virtual_sdcard.is_active %}
    {% set needle_offsets = printer['gcode_macro _NEEDLE_TIP_OFFSETS'] %}
    {% set bed_mesh_active = printer.bed_mesh.profile_name|default('')|string|length > 0 %}
    {% set position = printer.gcode_move.position %}
    {% set gcode_position = printer.gcode_move.gcode_position %}
    {% set absolute = printer.gcode_move.absolute_coordinates %}
    {% set axis_minimum = printer.toolhead.axis_minimum %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% set max_distance = cfg.max_z_distance|float if axis == 'Z' else cfg.max_xy_distance|float %}
    {% set max_feed = cfg.max_z_feed|float if axis == 'Z' else cfg.max_xy_feed|float %}

    {% if cfg.max_xy_distance|float != 25.0 or cfg.max_z_distance|float != 5.0 or cfg.min_feed|float != 30.0 or cfg.max_xy_feed|float != 6000.0 or cfg.max_z_feed|float != 1500.0 %}
        {action_raise_error("OpenSpotter jog safety limits were modified at runtime; restart Klipper to restore the commissioned contract")}
    {% endif %}
    {% if axis not in ['X', 'Y', 'Z'] %}
        {action_raise_error("OPENSPOTTER_JOG AXIS must be X, Y, or Z")}
    {% endif %}
    {% if print_state in ['printing', 'paused'] or virtual_sd_active %}
        {action_raise_error("OpenSpotter jog is blocked while a virtual-SD job is printing or paused")}
    {% endif %}
    {% if needle_offsets.enabled|int == 1 %}
        {action_raise_error("OpenSpotter jog requires needle tip offsets to be disabled")}
    {% endif %}
    {% if bed_mesh_active %}
        {action_raise_error("OpenSpotter jog requires bed mesh compensation to be cleared; run BED_MESH_CLEAR before jogging")}
    {% endif %}
    {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
        {action_raise_error("OpenSpotter jog requires all XYZ axes to be homed")}
    {% endif %}
    {% if not (distance|abs >= 0.000001 and distance|abs <= max_distance) %}
        {action_raise_error("OpenSpotter jog distance must be finite, non-zero, and within the configured per-command limit")}
    {% endif %}
    {% if not (feed >= cfg.min_feed|float and feed <= max_feed) %}
        {action_raise_error("OpenSpotter jog feed rate must be finite and within the configured axis range")}
    {% endif %}
    {% if axis == 'X' and (position.x|float + distance < axis_minimum.x|float or position.x|float + distance > axis_maximum.x|float) %}
        {action_raise_error("OpenSpotter X jog target is outside the configured toolhead limits")}
    {% endif %}
    {% if axis == 'Y' and (position.y|float + distance < axis_minimum.y|float or position.y|float + distance > axis_maximum.y|float) %}
        {action_raise_error("OpenSpotter Y jog target is outside the configured toolhead limits")}
    {% endif %}
    {% if axis == 'Z' and (position.z|float + distance < axis_minimum.z|float or position.z|float + distance > axis_maximum.z|float) %}
        {action_raise_error("OpenSpotter Z jog target is outside the configured toolhead limits")}
    {% endif %}

    {% if axis == 'X' %}
        _CHECK_MOVE_SAFETY X={gcode_position.x|float + distance if absolute else distance}
    {% elif axis == 'Y' %}
        _CHECK_MOVE_SAFETY Y={gcode_position.y|float + distance if absolute else distance}
    {% else %}
        _CHECK_MOVE_SAFETY Z={gcode_position.z|float + distance if absolute else distance}
    {% endif %}
    SAVE_GCODE_STATE NAME=_openspotter_jog_state
    {% if axis == 'X' %}
        G0.1 X{gcode_position.x|float + distance if absolute else distance} F{feed}
    {% elif axis == 'Y' %}
        G0.1 Y{gcode_position.y|float + distance if absolute else distance} F{feed}
    {% else %}
        G0.1 Z{gcode_position.z|float + distance if absolute else distance} F{feed}
    {% endif %}
    M400
    RESTORE_GCODE_STATE NAME=_openspotter_jog_state
