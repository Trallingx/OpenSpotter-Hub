# =============================================================================
# OpenSpotter remote-control contract
#
# These macros are the only application-owned entry points for routine manual
# motion.  They preserve G-code state, reject motion during virtual-SD jobs,
# require homed axes, cap distance/feed rate, and continue through the normal
# guarded G0/G1 wrappers in movement_safety.cfg.
# =============================================================================

[gcode_macro _OPENSPOTTER_RUNTIME]
description: Subscribed operator-prompt state for the OpenSpotter desktop application
variable_prompt: 0
gcode:
    OPENSPOTTER_RUNTIME_STATUS

[gcode_macro OPENSPOTTER_CONTRACT_V3]
description: Immutable advertised marker for the guarded OpenSpotter desktop contract v3
gcode:
    OPENSPOTTER_RUNTIME_STATUS

[gcode_macro OPENSPOTTER_SET_PROMPT]
description: Set the structured OpenSpotter operator prompt (0-99)
gcode:
    {% if params.PROMPT is not defined %}
        {action_raise_error("OPENSPOTTER_SET_PROMPT requires PROMPT=<0-99>")}
    {% endif %}
    {% set prompt = params.PROMPT|int %}
    {% if prompt < 0 or prompt > 99 %}
        {action_raise_error("OpenSpotter operator prompt must be between 0 and 99")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_OPENSPOTTER_RUNTIME VARIABLE=prompt VALUE={prompt}
    RESPOND MSG="OpenSpotter operator prompt={prompt}"

[gcode_macro OPENSPOTTER_RUNTIME_STATUS]
description: Report the structured OpenSpotter operator prompt
gcode:
    {% set runtime = printer['gcode_macro _OPENSPOTTER_RUNTIME'] %}
    RESPOND MSG="OpenSpotter remote contract=v3; operator prompt={runtime.prompt|int}"

[gcode_macro OPENSPOTTER_JOB_CLEANUP]
description: Non-motion cleanup shared by normal completion and cancellation
gcode:
    NEEDLE_TIP_OFFSETS_DISABLE
    BED_MESH_CLEAR
    _OPENSPOTTER_SET_Z_HOME_SGT
    SET_GCODE_VARIABLE MACRO=_OPENSPOTTER_RUNTIME VARIABLE=prompt VALUE=0
    M117
    RESPOND MSG="OpenSpotter job cleanup complete"

[gcode_macro OPENSPOTTER_JOG]
description: Guarded relative jog. Args: AXIS=X|Y|Z DISTANCE=<mm> F=<mm/min>
variable_max_xy_distance: 25.0
variable_max_z_distance: 5.0
variable_min_feed: 30.0
variable_max_xy_feed: 6000.0
variable_max_z_feed: 1500.0
gcode:
    {% if params.AXIS is not defined or params.DISTANCE is not defined %}
        {action_raise_error("OPENSPOTTER_JOG requires AXIS=X|Y|Z and DISTANCE=<mm>")}
    {% endif %}
    {% set cfg = printer['gcode_macro OPENSPOTTER_JOG'] %}
    {% set axis = params.AXIS|string|upper %}
    {% set distance = params.DISTANCE|float %}
    {% set feed = params.F|default(600)|float %}
    {% set homed = printer.toolhead.homed_axes|string|lower %}
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set virtual_sd_active = printer.virtual_sdcard.is_active %}
    {% set needle_offsets = printer['gcode_macro _NEEDLE_TIP_OFFSETS'] %}
    {% set bed_mesh_active = printer.bed_mesh.profile_name|default('')|string|length > 0 %}
    {% set position = printer.gcode_move.position %}
    {% set gcode_position = printer.gcode_move.gcode_position %}
    {% set absolute = printer.gcode_move.absolute_coordinates %}
    {% set axis_minimum = printer.toolhead.axis_minimum %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% set max_distance = cfg.max_z_distance|float if axis == 'Z' else cfg.max_xy_distance|float %}
    {% set max_feed = cfg.max_z_feed|float if axis == 'Z' else cfg.max_xy_feed|float %}

    {% if cfg.max_xy_distance|float != 25.0 or cfg.max_z_distance|float != 5.0 or cfg.min_feed|float != 30.0 or cfg.max_xy_feed|float != 6000.0 or cfg.max_z_feed|float != 1500.0 %}
        {action_raise_error("OpenSpotter jog safety limits were modified at runtime; restart Klipper to restore the commissioned contract")}
    {% endif %}
    {% if axis not in ['X', 'Y', 'Z'] %}
        {action_raise_error("OPENSPOTTER_JOG AXIS must be X, Y, or Z")}
    {% endif %}
    {% if print_state in ['printing', 'paused'] or virtual_sd_active %}
        {action_raise_error("OpenSpotter jog is blocked while a virtual-SD job is printing or paused")}
    {% endif %}
    {% if needle_offsets.enabled|int == 1 %}
        {action_raise_error("OpenSpotter jog requires needle tip offsets to be disabled")}
    {% endif %}
    {% if bed_mesh_active %}
        {action_raise_error("OpenSpotter jog requires bed mesh compensation to be cleared; run BED_MESH_CLEAR or Safe Home first")}
    {% endif %}
    {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
        {action_raise_error("OpenSpotter jog requires all XYZ axes to be homed")}
    {% endif %}
    {% if not (distance|abs >= 0.000001 and distance|abs <= max_distance) %}
        {action_raise_error("OpenSpotter jog distance must be finite, non-zero, and within the configured per-command limit")}
    {% endif %}
    {% if not (feed >= cfg.min_feed|float and feed <= max_feed) %}
        {action_raise_error("OpenSpotter jog feed rate must be finite and within the configured axis range")}
    {% endif %}
    {% if axis == 'X' and (position.x|float + distance < axis_minimum.x|float or position.x|float + distance > axis_maximum.x|float) %}
        {action_raise_error("OpenSpotter X jog target is outside the configured toolhead limits")}
    {% endif %}
    {% if axis == 'Y' and (position.y|float + distance < axis_minimum.y|float or position.y|float + distance > axis_maximum.y|float) %}
        {action_raise_error("OpenSpotter Y jog target is outside the configured toolhead limits")}
    {% endif %}
    {% if axis == 'Z' and (position.z|float + distance < axis_minimum.z|float or position.z|float + distance > axis_maximum.z|float) %}
        {action_raise_error("OpenSpotter Z jog target is outside the configured toolhead limits")}
    {% endif %}

    {% if axis == 'X' %}
        _CHECK_MOVE_SAFETY X={gcode_position.x|float + distance if absolute else distance}
    {% elif axis == 'Y' %}
        _CHECK_MOVE_SAFETY Y={gcode_position.y|float + distance if absolute else distance}
    {% else %}
        _CHECK_MOVE_SAFETY Z={gcode_position.z|float + distance if absolute else distance}
    {% endif %}
    SAVE_GCODE_STATE NAME=_openspotter_jog_state
    {% if axis == 'X' %}
        G0.1 X{gcode_position.x|float + distance if absolute else distance} F{feed}
    {% elif axis == 'Y' %}
        G0.1 Y{gcode_position.y|float + distance if absolute else distance} F{feed}
    {% else %}
        G0.1 Z{gcode_position.z|float + distance if absolute else distance} F{feed}
    {% endif %}
    M400
    RESTORE_GCODE_STATE NAME=_openspotter_jog_state

[gcode_macro _OPENSPOTTER_RELEASE_AXIS]
description: Internal sensorless-home release move that preserves the caller's coordinate mode
gcode:
    {% set axis = params.AXIS|string|upper %}
    {% set distance = params.DISTANCE|float %}
    {% set feed = params.F|default(3000)|float %}
    {% set position = printer.gcode_move.position %}
    {% set gcode_position = printer.gcode_move.gcode_position %}
    {% set absolute = printer.gcode_move.absolute_coordinates %}
    {% set axis_minimum = printer.toolhead.axis_minimum %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% if axis not in ['X', 'Y', 'Z'] %}
        {action_raise_error("_OPENSPOTTER_RELEASE_AXIS requires AXIS=X|Y|Z")}
    {% endif %}
    {% if not (distance|abs >= 0.000001 and distance|abs <= 25.0) %}
        {action_raise_error("OpenSpotter home release distance must be finite, non-zero, and no more than 25 mm")}
    {% endif %}
    {% if not (feed >= 1.0 and feed <= 6000.0) %}
        {action_raise_error("OpenSpotter home release feed must be finite and between 1 and 6000 mm/min")}
    {% endif %}
    {% if axis == 'X' and (position.x|float + distance < axis_minimum.x|float or position.x|float + distance > axis_maximum.x|float) %}
        {action_raise_error("OpenSpotter X home-release target is outside the configured toolhead limits")}
    {% endif %}
    {% if axis == 'Y' and (position.y|float + distance < axis_minimum.y|float or position.y|float + distance > axis_maximum.y|float) %}
        {action_raise_error("OpenSpotter Y home-release target is outside the configured toolhead limits")}
    {% endif %}
    {% if axis == 'Z' and (position.z|float + distance < axis_minimum.z|float or position.z|float + distance > axis_maximum.z|float) %}
        {action_raise_error("OpenSpotter Z home-release target is outside the configured toolhead limits")}
    {% endif %}
    {% if axis == 'X' %}
        _CHECK_MOVE_SAFETY X={gcode_position.x|float + distance if absolute else distance}
    {% elif axis == 'Y' %}
        _CHECK_MOVE_SAFETY Y={gcode_position.y|float + distance if absolute else distance}
    {% else %}
        _CHECK_MOVE_SAFETY Z={gcode_position.z|float + distance if absolute else distance}
    {% endif %}
    SAVE_GCODE_STATE NAME=_openspotter_home_release_state
    {% if axis == 'X' %}
        G0.1 X{gcode_position.x|float + distance if absolute else distance} F{feed}
    {% elif axis == 'Y' %}
        G0.1 Y{gcode_position.y|float + distance if absolute else distance} F{feed}
    {% else %}
        G0.1 Z{gcode_position.z|float + distance if absolute else distance} F{feed}
    {% endif %}
    M400
    RESTORE_GCODE_STATE NAME=_openspotter_home_release_state

[gcode_macro _OPENSPOTTER_MOVE_PHYSICAL_Z]
description: Internal physical-Z move that preserves the caller's logical coordinate frame
gcode:
    {% if params.TARGET is not defined %}
        {action_raise_error("_OPENSPOTTER_MOVE_PHYSICAL_Z requires TARGET=<machine_z_mm>")}
    {% endif %}
    {% set target = params.TARGET|float %}
    {% set feed = params.F|default(3000)|float %}
    {% set position = printer.gcode_move.position %}
    {% set gcode_position = printer.gcode_move.gcode_position %}
    {% set absolute = printer.gcode_move.absolute_coordinates %}
    {% set axis_minimum = printer.toolhead.axis_minimum %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% set delta = target - position.z|float %}
    {% set raw_target = gcode_position.z|float + delta if absolute else delta %}
    {% if not (target >= axis_minimum.z|float and target <= axis_maximum.z|float) %}
        {action_raise_error("OpenSpotter physical Z target is outside the configured toolhead limits")}
    {% endif %}
    {% if not (feed >= 1.0 and feed <= 6000.0) %}
        {action_raise_error("OpenSpotter physical Z feed must be finite and between 1 and 6000 mm/min")}
    {% endif %}
    _CHECK_MOVE_SAFETY Z={raw_target}
    SAVE_GCODE_STATE NAME=_openspotter_physical_z_state
    G0.1 Z{raw_target} F{feed}
    M400
    RESTORE_GCODE_STATE NAME=_openspotter_physical_z_state

[gcode_macro _OPENSPOTTER_VALIDATE_SENSORLESS_HOME]
description: Internal validation shared by manual and virtual-SD homing entry points
gcode:
    {% set commissioned_z_home_sgt = 10 %}
    {% set stepper_x = printer.configfile.settings['stepper_x'] %}
    {% set stepper_y = printer.configfile.settings['stepper_y'] %}
    {% set stepper_z = printer.configfile.settings['stepper_z'] %}
    {% set tmc_z = printer.configfile.settings['tmc2130 stepper_z'] %}
    {% if stepper_x.homing_retract_dist|float != 0.0 or stepper_y.homing_retract_dist|float != 0.0 or stepper_z.homing_retract_dist|float != 0.0 %}
        {action_raise_error("OpenSpotter sensorless home requires homing_retract_dist=0 on X, Y, and Z")}
    {% endif %}
    {% if tmc_z.driver_sgt|int != commissioned_z_home_sgt %}
        {action_raise_error("OpenSpotter Z sensorless home requires configured driver_SGT=" ~ commissioned_z_home_sgt)}
    {% endif %}

[gcode_macro _OPENSPOTTER_SET_Z_HOME_SGT]
description: Restore the commissioned Z sensorless-homing sensitivity from the active TMC config
gcode:
    {% set z_home_sgt = printer.configfile.settings['tmc2130 stepper_z'].driver_sgt|int %}
    SET_TMC_FIELD STEPPER=stepper_z FIELD=SGT VALUE={z_home_sgt}

[gcode_macro _OPENSPOTTER_HOME_SEQUENCE]
description: Internal reviewed sensorless Z/Y/clearance/X homing sequence
gcode:
    {% set commissioned_clearance_z = 35.0 %}
    {% set settle_ms = 2000 %}
    {% set release_distance = 5.0 %}
    {% set clearance_z = params.X_CLEARANCE_Z|default(commissioned_clearance_z)|float %}
    {% set clearance_feed = params.CLEARANCE_F|default(3000.0)|float %}
    {% set axis_minimum = printer.toolhead.axis_minimum %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% set zones = printer.save_variables.variables.movement_dead_zones|default([]) %}
    {% set required_clearance = namespace(value=commissioned_clearance_z) %}
    {% for zone in zones %}
        {% set zone_enabled = zone.enabled|default(1)|int(none) %}
        {% if zone_enabled is none or zone_enabled not in [0, 1] %}
            {action_raise_error("OpenSpotter homing blocked by invalid ENABLED value in saved dead zone '" ~ zone.name|default('unnamed') ~ "'")}
        {% endif %}
        {% if zone_enabled == 1 %}
            {% set zone_x_min = zone.x_min|default(0.0)|float(none) %}
            {% set zone_x_max = zone.x_max|default(0.0)|float(none) %}
            {% set zone_y_min = zone.y_min|default(0.0)|float(none) %}
            {% set zone_y_max = zone.y_max|default(0.0)|float(none) %}
            {% set zone_clearance = zone.z_clearance|default(0.0)|float(none) %}
            {% if zone_x_min is none or zone_x_max is none or zone_y_min is none or zone_y_max is none or zone_clearance is none %}
                {action_raise_error("OpenSpotter homing blocked by non-numeric saved dead zone '" ~ zone.name|default('unnamed') ~ "'; clear or replace it first")}
            {% elif not (zone_x_min >= axis_minimum.x|float and zone_x_min <= axis_maximum.x|float and zone_x_max >= axis_minimum.x|float and zone_x_max <= axis_maximum.x|float and zone_y_min >= axis_minimum.y|float and zone_y_min <= axis_maximum.y|float and zone_y_max >= axis_minimum.y|float and zone_y_max <= axis_maximum.y|float and zone_clearance >= axis_minimum.z|float and zone_clearance <= axis_maximum.z|float) %}
                {action_raise_error("OpenSpotter homing blocked by invalid saved dead zone '" ~ zone.name|default('unnamed') ~ "'; clear or replace it first")}
            {% endif %}
            {% if zone_clearance > required_clearance.value %}
                {% set required_clearance.value = zone_clearance %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if not (clearance_z >= required_clearance.value and clearance_z >= axis_minimum.z|float and clearance_z <= axis_maximum.z|float) %}
        {action_raise_error("OpenSpotter homing clearance Z must be finite, within the configured Z limits, and at least " ~ required_clearance.value ~ " mm (commissioned minimum 35 mm plus enabled dead zones)")}
    {% endif %}
    {% if not (clearance_feed >= 1.0 and clearance_feed <= 6000.0) %}
        {action_raise_error("OpenSpotter homing clearance feed must be finite and between 1 and 6000 mm/min")}
    {% endif %}
    NEEDLE_TIP_OFFSETS_DISABLE
    BED_MESH_CLEAR
    _OPENSPOTTER_SET_Z_HOME_SGT
    G4 P{settle_ms}
    G28 Z0
    _OPENSPOTTER_RELEASE_AXIS AXIS=Z DISTANCE=-{release_distance} F={clearance_feed}
    G4 P{settle_ms}
    G28 Y0
    _OPENSPOTTER_RELEASE_AXIS AXIS=Y DISTANCE={release_distance} F={clearance_feed}
    _OPENSPOTTER_MOVE_PHYSICAL_Z TARGET={clearance_z} F={clearance_feed}
    G4 P{settle_ms}
    G28 X0
    _OPENSPOTTER_RELEASE_AXIS AXIS=X DISTANCE={release_distance} F={clearance_feed}
    M400

[gcode_macro _OPENSPOTTER_JOB_REHOME_Z_SEQUENCE]
description: Internal double-Z alignment sequence used by the active virtual-SD workflow
gcode:
    {% set settle_ms = 2000 %}
    {% set release_distance = 5.0 %}
    {% set clearance_feed = 3000.0 %}
    NEEDLE_TIP_OFFSETS_DISABLE
    BED_MESH_CLEAR
    _OPENSPOTTER_SET_Z_HOME_SGT
    G4 P{settle_ms}
    G28 Z0
    _OPENSPOTTER_RELEASE_AXIS AXIS=Z DISTANCE=-{release_distance} F={clearance_feed}
    _OPENSPOTTER_SET_Z_HOME_SGT
    G4 P{settle_ms}
    G28 Z0
    _OPENSPOTTER_RELEASE_AXIS AXIS=Z DISTANCE=-{release_distance} F={clearance_feed}
    M400

[gcode_macro OPENSPOTTER_HOME]
description: Guarded manual full home; blocked whenever virtual SD is active
gcode:
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set virtual_sd_active = printer.virtual_sdcard.is_active %}
    {% if print_state in ['printing', 'paused'] or virtual_sd_active %}
        {action_raise_error("OpenSpotter homing is blocked while a virtual-SD job is printing or paused")}
    {% endif %}
    _OPENSPOTTER_VALIDATE_SENSORLESS_HOME
    _OPENSPOTTER_HOME_SEQUENCE

[gcode_macro OPENSPOTTER_JOB_HOME]
description: Job-only reviewed full home; requires an actively printing virtual-SD workflow
gcode:
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set virtual_sd_active = printer.virtual_sdcard.is_active %}
    {% if not virtual_sd_active or print_state != 'printing' %}
        {action_raise_error("OPENSPOTTER_JOB_HOME is only valid while a virtual-SD job is actively printing")}
    {% endif %}
    _OPENSPOTTER_VALIDATE_SENSORLESS_HOME
    _OPENSPOTTER_HOME_SEQUENCE{% if params.X_CLEARANCE_Z is defined %} X_CLEARANCE_Z={params.X_CLEARANCE_Z}{% endif %}{% if params.CLEARANCE_F is defined %} CLEARANCE_F={params.CLEARANCE_F}{% endif %}

[gcode_macro OPENSPOTTER_JOB_REHOME_Z]
description: Job-only reviewed double-Z rehome; requires an actively printing virtual-SD workflow
gcode:
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set virtual_sd_active = printer.virtual_sdcard.is_active %}
    {% if not virtual_sd_active or print_state != 'printing' %}
        {action_raise_error("OPENSPOTTER_JOB_REHOME_Z is only valid while a virtual-SD job is actively printing")}
    {% endif %}
    _OPENSPOTTER_VALIDATE_SENSORLESS_HOME
    _OPENSPOTTER_JOB_REHOME_Z_SEQUENCE
