# =============================================================================
# Movement Safety / Dead Zones / Needle Tip Offsets
# =============================================================================
# Normal G0/G1 moves are routed through this guard. When needle tip offsets are
# enabled, absolute XYZ move targets are interpreted as needle-tip coordinates:
# saved tcp_offset_x/y/z are added to the commanded axes and the live
# needle_surface_z_offset is added to Z. Relative moves remain relative deltas.
#
# Dead zones are stored dynamically in save_variables as movement_dead_zones.
# Their bounds are machine/physical coordinates.  The guard converts absolute
# logical G-code targets into that physical frame before testing a path.
# The guard loops over however many saved zones exist:
#   []                         -> no zone checks
#   [{'name':'zone1', ...}]    -> check one zone
#   [{'name':'zone1', ...},
#    {'name':'zone2', ...}]    -> check both zones
#
# Each zone is an XY rectangle with independent movement rules:
#   allow_when_above: allow any move touching the zone if both start and target
#                     Z are at/above z_clearance.
#   allow_exit:       allow XY moves from inside the zone to outside.
#   allow_z_lift:     allow pure Z-up moves while inside the zone.
#   allow_z_lower:    allow pure Z-down moves while inside the zone.
#   allow_xy_inside:  allow XY moves that start and end inside the zone.
#
# Conservative path check:
#   If a move's XY bounding box overlaps a zone, the move is treated as touching
#   that zone. This is intentionally stricter than exact line intersection.
#
# Example:
#   SET_DEAD_ZONE NAME=fixture X_MIN=80 X_MAX=170 Y_MIN=60 Y_MAX=160 Z_CLEARANCE=20 ALLOW_WHEN_ABOVE=1 ALLOW_EXIT=1 ALLOW_Z_LIFT=1
#   MOVEMENT_SAFETY_ENABLE
#
# Needle tip offset workflow:
#   TCPCALIBRATE / TCPSTART saves tcp_offset_x/y/z, the coordinate version,
#   and tcp_ready=True.
#   NEEDLE_TIP_OFFSETS_ENABLE
#   SET_NEEDLE_SURFACE_OFFSET Z=-0.030 MOVE=1 SAVE=1
#   NEEDLE_TIP_OFFSETS_DISABLE
# A UI slider can repeatedly send SET_NEEDLE_SURFACE_OFFSET with MOVE=1.
# Negative surface Z moves the needle closer to the substrate.
# =============================================================================

[gcode_macro _NEEDLE_TIP_OFFSETS]
description: Runtime defaults for applying saved TCP offsets plus live needle Z trim to normal G0/G1 moves
variable_enabled: 0
variable_require_tcp_ready: 1
variable_surface_z: 0.0
variable_min_surface_z: -2.0
variable_max_surface_z: 2.0
gcode:
    NEEDLE_TIP_OFFSETS_STATUS

[delayed_gcode NEEDLE_TIP_OFFSETS_INIT]
initial_duration: 1.0
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set saved_surface_z = svv.needle_surface_z_offset|default(0.0)|float %}
    SET_GCODE_VARIABLE MACRO=_NEEDLE_TIP_OFFSETS VARIABLE=surface_z VALUE={saved_surface_z}

[gcode_macro NEEDLE_TIP_OFFSETS_ENABLE]
description: Enable saved TCP XYZ offsets plus live needle Z trim for normal G0/G1 moves
gcode:
    {% set cfg = printer['gcode_macro _NEEDLE_TIP_OFFSETS'] %}
    {% set svv = printer.save_variables.variables %}
    {% set require_tcp = params.REQUIRE_TCP|default(cfg.require_tcp_ready)|int %}
    {% if require_tcp == 1 and svv.tcp_ready|default(false) != true %}
        {action_raise_error("Needle tip offsets blocked: saved TCP calibration is not ready (tcp_ready=" ~ svv.tcp_ready|default(false) ~ "). Run TCPSTART/TCPCALIBRATE first, or use NEEDLE_TIP_OFFSETS_ENABLE REQUIRE_TCP=0 for a dry run.")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_NEEDLE_TIP_OFFSETS VARIABLE=enabled VALUE=1
    RESPOND MSG="Needle tip offsets enabled: tcp X={svv.tcp_offset_x|default(0.0)} Y={svv.tcp_offset_y|default(0.0)} Z={svv.tcp_offset_z|default(0.0)}, live surface Z={cfg.surface_z|float|round(4)}"

[gcode_macro NEEDLE_TIP_OFFSETS_DISABLE]
description: Disable TCP/live needle offsets for normal G0/G1 moves
gcode:
    SET_GCODE_VARIABLE MACRO=_NEEDLE_TIP_OFFSETS VARIABLE=enabled VALUE=0
    RESPOND MSG="Needle tip offsets disabled"

[gcode_macro NEEDLE_TIP_OFFSETS_STATUS]
description: Report TCP offsets and live needle surface Z trim
gcode:
    {% set cfg = printer['gcode_macro _NEEDLE_TIP_OFFSETS'] %}
    {% set svv = printer.save_variables.variables %}
    {% set tcp_x = svv.tcp_offset_x|default(0.0)|float %}
    {% set tcp_y = svv.tcp_offset_y|default(0.0)|float %}
    {% set tcp_z = svv.tcp_offset_z|default(0.0)|float %}
    {% set surface_z = cfg.surface_z|float %}
    RESPOND MSG="Needle offsets enabled={cfg.enabled|int}; tcp_ready={svv.tcp_ready|default(false)}; TCP X={tcp_x|round(4)} Y={tcp_y|round(4)} Z={tcp_z|round(4)}; live surface Z={surface_z|round(4)}; total Z add={(tcp_z + surface_z)|round(4)}"

[gcode_macro SET_NEEDLE_SURFACE_OFFSET]
description: Set live needle-to-surface Z trim. Args: Z MOVE=0|1 SAVE=0|1 F=<feedrate>
gcode:
    {% if params.Z is not defined %}
        {action_raise_error("SET_NEEDLE_SURFACE_OFFSET requires Z=<offset_mm>")}
    {% endif %}
    {% set cfg = printer['gcode_macro _NEEDLE_TIP_OFFSETS'] %}
    {% set old_z = cfg.surface_z|float %}
    {% set new_z = params.Z|float %}
    {% set min_z = cfg.min_surface_z|float %}
    {% set max_z = cfg.max_surface_z|float %}
    {% set move = params.MOVE|default(0)|int %}
    {% set save = params.SAVE|default(0)|int %}
    {% set feed = params.F|default(300)|float %}
    {% set position = printer.toolhead.position %}
    {% set gcode_position = printer.gcode_move.gcode_position %}
    {% set absolute = printer.gcode_move.absolute_coordinates %}
    {% set axis_minimum = printer.toolhead.axis_minimum %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% if not (new_z >= min_z and new_z <= max_z) %}
        {action_raise_error("Needle surface offset must be finite and inside allowed range [" ~ min_z ~ ", " ~ max_z ~ "] mm")}
    {% endif %}
    {% if not (feed >= 1.0 and feed <= 1500.0) %}
        {action_raise_error("Needle surface offset feed must be finite and between 1 and 1500 mm/min")}
    {% endif %}
    {% if not (old_z >= min_z and old_z <= max_z) and move == 1 %}
        {action_raise_error("Existing live needle Z is invalid; recover with SET_NEEDLE_SURFACE_OFFSET Z=0 MOVE=0 SAVE=0 before requesting motion")}
    {% endif %}
    {% set delta = new_z - old_z %}
    {% set target_z = position.z|float + delta %}
    {% if move == 1 and cfg.enabled|int == 1 and delta|abs > 0.000001 %}
        {% if not (target_z >= axis_minimum.z|float and target_z <= axis_maximum.z|float) %}
            {action_raise_error("Live needle Z target is outside the configured toolhead limits")}
        {% endif %}
        _CHECK_MOVE_SAFETY Z={gcode_position.z|float + delta if absolute else delta}
        SAVE_GCODE_STATE NAME=_needle_surface_offset_live
        G0.1 Z{gcode_position.z|float + delta if absolute else delta} F{feed}
        M400
        RESTORE_GCODE_STATE NAME=_needle_surface_offset_live
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_NEEDLE_TIP_OFFSETS VARIABLE=surface_z VALUE={new_z}
    {% if save == 1 %}
        SAVE_VARIABLE VARIABLE=needle_surface_z_offset VALUE={new_z}
    {% endif %}
    RESPOND MSG="Needle surface Z offset set to {new_z|round(4)} mm; delta={delta|round(4)} mm; enabled={cfg.enabled|int}"

[gcode_macro ADJUST_NEEDLE_SURFACE_OFFSET]
description: Increment live needle-to-surface Z trim. Args: Z_ADJUST=<delta_mm> MOVE=0|1 SAVE=0|1 F=<feedrate>
gcode:
    {% if params.Z_ADJUST is not defined and params.Z is not defined %}
        {action_raise_error("ADJUST_NEEDLE_SURFACE_OFFSET requires Z_ADJUST=<delta_mm>")}
    {% endif %}
    {% set cfg = printer['gcode_macro _NEEDLE_TIP_OFFSETS'] %}
    {% set adjust = params.Z_ADJUST|default(params.Z)|float %}
    {% set new_z = cfg.surface_z|float + adjust %}
    SET_NEEDLE_SURFACE_OFFSET Z={new_z} MOVE={params.MOVE|default(0)|int} SAVE={params.SAVE|default(0)|int}{% if params.F is defined %} F={params.F}{% endif %}

[gcode_macro RESET_NEEDLE_SURFACE_OFFSET]
description: Reset live needle-to-surface Z trim to zero. Args: MOVE=0|1 SAVE=0|1 F=<feedrate>
gcode:
    SET_NEEDLE_SURFACE_OFFSET Z=0 MOVE={params.MOVE|default(0)|int} SAVE={params.SAVE|default(0)|int}{% if params.F is defined %} F={params.F}{% endif %}

[gcode_macro _MOVEMENT_SAFETY]
description: Runtime defaults for G0/G1 dead-zone crash protection
variable_enabled: 0
gcode:
    MOVEMENT_SAFETY_STATUS

[gcode_macro MOVEMENT_SAFETY_ENABLE]
description: Enable G0/G1 dead-zone checks
gcode:
    SET_GCODE_VARIABLE MACRO=_MOVEMENT_SAFETY VARIABLE=enabled VALUE=1
    SAVE_VARIABLE VARIABLE=movement_safety_enabled VALUE=1
    RESPOND MSG="Movement safety enabled"

[gcode_macro MOVEMENT_SAFETY_DISABLE]
description: Disable G0/G1 dead-zone checks
gcode:
    SET_GCODE_VARIABLE MACRO=_MOVEMENT_SAFETY VARIABLE=enabled VALUE=0
    SAVE_VARIABLE VARIABLE=movement_safety_enabled VALUE=0
    RESPOND MSG="Movement safety disabled"

[gcode_macro MOVEMENT_SAFETY_STATUS]
description: Show saved movement safety state
gcode:
    {% set cfg = printer['gcode_macro _MOVEMENT_SAFETY'] %}
    {% set svv = printer.save_variables.variables %}
    {% set zones = svv.movement_dead_zones|default([]) %}
    {% set enabled = svv.movement_safety_enabled|default(cfg.enabled)|int %}
    RESPOND MSG="Movement safety enabled={enabled}; saved dead zones={zones|length}"
    {% for zone in zones %}
        RESPOND MSG="{loop.index}: {zone.name|default('unnamed')} enabled={zone.enabled|default(1)} X[{zone.x_min|default(0.0)},{zone.x_max|default(0.0)}] Y[{zone.y_min|default(0.0)},{zone.y_max|default(0.0)}] Z_CLEARANCE={zone.z_clearance|default(0.0)}"
    {% endfor %}

[gcode_macro SET_DEAD_ZONE]
description: Save or update a movement dead zone. Args: NAME or ZONE, X_MIN X_MAX Y_MIN Y_MAX Z_CLEARANCE ALLOW_*
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set zones = svv.movement_dead_zones|default([]) %}

    {% if params.NAME is defined %}
        {% set zone_name = params.NAME|string %}
    {% elif params.ZONE is defined %}
        {% set zone_name = "zone" ~ params.ZONE|string %}
    {% else %}
        {% set zone_name = "zone" ~ (zones|length + 1) %}
    {% endif %}

    {% set existing = namespace(
        found=0,
        enabled=1,
        x_min=0.0,
        x_max=0.0,
        y_min=0.0,
        y_max=0.0,
        z_clearance=0.0,
        allow_when_above=1,
        allow_exit=1,
        allow_z_lift=1,
        allow_z_lower=0,
        allow_xy_inside=0
    ) %}

    {% for zone in zones %}
        {% if zone.name|default('')|string == zone_name %}
            {% set existing.found = 1 %}
            {% set existing.enabled = zone.enabled|default(existing.enabled)|int(none) %}
            {% set existing.x_min = zone.x_min|default(existing.x_min)|float(none) %}
            {% set existing.x_max = zone.x_max|default(existing.x_max)|float(none) %}
            {% set existing.y_min = zone.y_min|default(existing.y_min)|float(none) %}
            {% set existing.y_max = zone.y_max|default(existing.y_max)|float(none) %}
            {% set existing.z_clearance = zone.z_clearance|default(existing.z_clearance)|float(none) %}
            {% set existing.allow_when_above = zone.allow_when_above|default(existing.allow_when_above)|int(none) %}
            {% set existing.allow_exit = zone.allow_exit|default(existing.allow_exit)|int(none) %}
            {% set existing.allow_z_lift = zone.allow_z_lift|default(existing.allow_z_lift)|int(none) %}
            {% set existing.allow_z_lower = zone.allow_z_lower|default(existing.allow_z_lower)|int(none) %}
            {% set existing.allow_xy_inside = zone.allow_xy_inside|default(existing.allow_xy_inside)|int(none) %}
        {% endif %}
    {% endfor %}

    {% set axis_minimum = printer.toolhead.axis_minimum %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% set enabled = params.ENABLED|default(existing.enabled)|int(none) %}
    {% set x_min = params.X_MIN|default(existing.x_min)|float(none) %}
    {% set x_max = params.X_MAX|default(existing.x_max)|float(none) %}
    {% set y_min = params.Y_MIN|default(existing.y_min)|float(none) %}
    {% set y_max = params.Y_MAX|default(existing.y_max)|float(none) %}
    {% set z_clearance = params.Z_CLEARANCE|default(existing.z_clearance)|float(none) %}
    {% set allow_when_above = params.ALLOW_WHEN_ABOVE|default(existing.allow_when_above)|int(none) %}
    {% set allow_exit = params.ALLOW_EXIT|default(existing.allow_exit)|int(none) %}
    {% set allow_z_lift = params.ALLOW_Z_LIFT|default(existing.allow_z_lift)|int(none) %}
    {% set allow_z_lower = params.ALLOW_Z_LOWER|default(existing.allow_z_lower)|int(none) %}
    {% set allow_xy_inside = params.ALLOW_XY_INSIDE|default(existing.allow_xy_inside)|int(none) %}

    {% if enabled is none or x_min is none or x_max is none or y_min is none or y_max is none or z_clearance is none or allow_when_above is none or allow_exit is none or allow_z_lift is none or allow_z_lower is none or allow_xy_inside is none %}
        {action_raise_error("Dead-zone coordinates, clearance, ENABLED, and ALLOW_* values must be numeric")}
    {% endif %}
    {% if enabled not in [0, 1] or allow_when_above not in [0, 1] or allow_exit not in [0, 1] or allow_z_lift not in [0, 1] or allow_z_lower not in [0, 1] or allow_xy_inside not in [0, 1] %}
        {action_raise_error("Dead-zone ENABLED and ALLOW_* values must be 0 or 1")}
    {% endif %}
    {% if not (x_min >= axis_minimum.x|float and x_min <= axis_maximum.x|float and x_max >= axis_minimum.x|float and x_max <= axis_maximum.x|float and x_min <= x_max) %}
        {action_raise_error("Dead-zone X_MIN/X_MAX must be finite, ordered, and inside the configured X limits")}
    {% endif %}
    {% if not (y_min >= axis_minimum.y|float and y_min <= axis_maximum.y|float and y_max >= axis_minimum.y|float and y_max <= axis_maximum.y|float and y_min <= y_max) %}
        {action_raise_error("Dead-zone Y_MIN/Y_MAX must be finite, ordered, and inside the configured Y limits")}
    {% endif %}
    {% if not (z_clearance >= axis_minimum.z|float and z_clearance <= axis_maximum.z|float) %}
        {action_raise_error("Dead-zone Z_CLEARANCE must be finite and inside the configured Z limits")}
    {% endif %}

    {% set updated_zone = {
        'name': zone_name,
        'enabled': enabled,
        'x_min': x_min,
        'x_max': x_max,
        'y_min': y_min,
        'y_max': y_max,
        'z_clearance': z_clearance,
        'allow_when_above': allow_when_above,
        'allow_exit': allow_exit,
        'allow_z_lift': allow_z_lift,
        'allow_z_lower': allow_z_lower,
        'allow_xy_inside': allow_xy_inside
    } %}

    {% set ns = namespace(updated_zones=[]) %}
    {% for zone in zones %}
        {% if zone.name|default('')|string != zone_name %}
            {% set ns.updated_zones = ns.updated_zones + [zone] %}
        {% endif %}
    {% endfor %}
    {% set ns.updated_zones = ns.updated_zones + [updated_zone] %}

    SAVE_VARIABLE VARIABLE=movement_dead_zones VALUE={ns.updated_zones|string|replace(" ", "")}
    RESPOND MSG="Saved dead zone {zone_name}; total saved zones={ns.updated_zones|length}"

[gcode_macro REMOVE_DEAD_ZONE]
description: Remove a saved movement dead zone. Args: NAME or ZONE
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set zones = svv.movement_dead_zones|default([]) %}

    {% if params.NAME is defined %}
        {% set zone_name = params.NAME|string %}
    {% elif params.ZONE is defined %}
        {% set zone_name = "zone" ~ params.ZONE|string %}
    {% else %}
        {action_raise_error("REMOVE_DEAD_ZONE requires NAME=<name> or ZONE=<number>")}
    {% endif %}

    {% set ns = namespace(updated_zones=[], removed=0) %}
    {% for zone in zones %}
        {% if zone.name|default('')|string == zone_name %}
            {% set ns.removed = ns.removed + 1 %}
        {% else %}
            {% set ns.updated_zones = ns.updated_zones + [zone] %}
        {% endif %}
    {% endfor %}

    SAVE_VARIABLE VARIABLE=movement_dead_zones VALUE={ns.updated_zones|string|replace(" ", "")}
    RESPOND MSG="Removed {ns.removed} saved dead zone(s) named {zone_name}; total saved zones={ns.updated_zones|length}"

[gcode_macro CLEAR_DEAD_ZONES]
description: Remove all saved movement dead zones
gcode:
    SAVE_VARIABLE VARIABLE=movement_dead_zones VALUE=[]
    RESPOND MSG="Cleared all saved movement dead zones"

[gcode_macro _CHECK_MOVE_SAFETY]
description: Internal guard used by the G0/G1 overrides
gcode:
    {% set cfg = printer['gcode_macro _MOVEMENT_SAFETY'] %}
    {% set svv = printer.save_variables.variables %}
    {% set zones = svv.movement_dead_zones|default([]) %}
    {% set enabled = svv.movement_safety_enabled|default(cfg.enabled)|int(none) %}
    {% if enabled is none or enabled not in [0, 1] %}
        {action_raise_error("Saved movement safety state is invalid; run MOVEMENT_SAFETY_ENABLE or MOVEMENT_SAFETY_DISABLE")}
    {% endif %}
    {% set requested_x = params.X|float(none) if params.X is defined else none %}
    {% set requested_y = params.Y|float(none) if params.Y is defined else none %}
    {% set requested_z = params.Z|float(none) if params.Z is defined else none %}
    {% set requested_f = params.F|float(none) if params.F is defined else none %}
    {% if params.E is defined %}
        {action_raise_error("G0/G1 E moves are unsupported; use the syringe ASPIRATE/DISPENSE macros")}
    {% endif %}
    {% if (params.X is defined and requested_x is none) or (params.Y is defined and requested_y is none) or (params.Z is defined and requested_z is none) or (params.F is defined and requested_f is none) %}
        {action_raise_error("G0/G1 XYZ/F parameters must be numeric")}
    {% endif %}

    {% set pos = printer.gcode_move.position %}
    {% set gcode_pos = printer.gcode_move.gcode_position %}
    {% set absolute = printer.gcode_move.absolute_coordinates %}
    {% set sx = pos.x|float %}
    {% set sy = pos.y|float %}
    {% set sz = pos.z|float %}
    {% set tx = requested_x + (pos.x|float - gcode_pos.x|float) if requested_x is not none and absolute else pos.x|float + requested_x if requested_x is not none else pos.x|float %}
    {% set ty = requested_y + (pos.y|float - gcode_pos.y|float) if requested_y is not none and absolute else pos.y|float + requested_y if requested_y is not none else pos.y|float %}
    {% set tz = requested_z + (pos.z|float - gcode_pos.z|float) if requested_z is not none and absolute else pos.z|float + requested_z if requested_z is not none else pos.z|float %}
    {% set axis_minimum = printer.toolhead.axis_minimum %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% set configured_max_feed = printer.configfile.settings['printer'].max_velocity|float * 60.0 %}
    {% if requested_x is not none and not (tx >= axis_minimum.x|float and tx <= axis_maximum.x|float) %}
        {action_raise_error("G0/G1 X target must be finite and inside the configured machine limits")}
    {% endif %}
    {% if requested_y is not none and not (ty >= axis_minimum.y|float and ty <= axis_maximum.y|float) %}
        {action_raise_error("G0/G1 Y target must be finite and inside the configured machine limits")}
    {% endif %}
    {% if requested_z is not none and not (tz >= axis_minimum.z|float and tz <= axis_maximum.z|float) %}
        {action_raise_error("G0/G1 Z target must be finite and inside the configured machine limits")}
    {% endif %}
    {% if requested_f is not none and not (requested_f > 0.0 and requested_f <= configured_max_feed) %}
        {action_raise_error("G0/G1 feed must be finite, positive, and no greater than the configured machine maximum")}
    {% endif %}

    {% if enabled == 1 and zones|length > 0 and (requested_x is not none or requested_y is not none or requested_z is not none) %}
        {% set moving_xy = params.X is defined or params.Y is defined %}
        {% set moving_z_only = params.Z is defined and not moving_xy %}
        {% set moving_z_up_only = moving_z_only and tz >= sz %}
        {% set moving_z_down_only = moving_z_only and tz < sz %}
        {% set min_x = [sx, tx]|min %}
        {% set max_x = [sx, tx]|max %}
        {% set min_y = [sy, ty]|min %}
        {% set max_y = [sy, ty]|max %}
        {% set ns = namespace(blocked=0, zone='') %}

        {% for zone in zones %}
            {% set zone_enabled = zone.enabled|default(1)|int(none) %}
            {% if zone_enabled is none %}
                {action_raise_error("Invalid saved dead zone '" ~ zone.name|default('unnamed') ~ "': ENABLED must be numeric")}
            {% endif %}
            {% if zone_enabled not in [0, 1] %}
                {action_raise_error("Invalid saved dead zone '" ~ zone.name|default('unnamed') ~ "': ENABLED must be 0 or 1")}
            {% endif %}
            {% if ns.blocked == 0 and zone_enabled == 1 %}
                {% set raw_x_min = zone.x_min|default(0.0)|float(none) %}
                {% set raw_x_max = zone.x_max|default(0.0)|float(none) %}
                {% set raw_y_min = zone.y_min|default(0.0)|float(none) %}
                {% set raw_y_max = zone.y_max|default(0.0)|float(none) %}
                {% set z_clear = zone.z_clearance|default(0.0)|float(none) %}
                {% set allow_when_above = zone.allow_when_above|default(1)|int(none) %}
                {% set allow_exit = zone.allow_exit|default(1)|int(none) %}
                {% set allow_z_lift = zone.allow_z_lift|default(1)|int(none) %}
                {% set allow_z_lower = zone.allow_z_lower|default(0)|int(none) %}
                {% set allow_xy_inside = zone.allow_xy_inside|default(0)|int(none) %}
                {% if raw_x_min is none or raw_x_max is none or raw_y_min is none or raw_y_max is none or z_clear is none or allow_when_above is none or allow_exit is none or allow_z_lift is none or allow_z_lower is none or allow_xy_inside is none %}
                    {action_raise_error("Invalid saved dead zone '" ~ zone.name|default('unnamed') ~ "': values must be numeric")}
                {% elif not (raw_x_min >= axis_minimum.x|float and raw_x_min <= axis_maximum.x|float and raw_x_max >= axis_minimum.x|float and raw_x_max <= axis_maximum.x|float and raw_y_min >= axis_minimum.y|float and raw_y_min <= axis_maximum.y|float and raw_y_max >= axis_minimum.y|float and raw_y_max <= axis_maximum.y|float and z_clear >= axis_minimum.z|float and z_clear <= axis_maximum.z|float) %}
                    {action_raise_error("Invalid saved dead zone '" ~ zone.name|default('unnamed') ~ "': clear or replace it before moving")}
                {% endif %}
                {% if allow_when_above not in [0, 1] or allow_exit not in [0, 1] or allow_z_lift not in [0, 1] or allow_z_lower not in [0, 1] or allow_xy_inside not in [0, 1] %}
                    {action_raise_error("Invalid saved dead zone '" ~ zone.name|default('unnamed') ~ "': ALLOW_* values must be 0 or 1")}
                {% endif %}
                {% set zx_min = [raw_x_min, raw_x_max]|min %}
                {% set zx_max = [raw_x_min, raw_x_max]|max %}
                {% set zy_min = [raw_y_min, raw_y_max]|min %}
                {% set zy_max = [raw_y_min, raw_y_max]|max %}
                {% set start_inside = sx >= zx_min and sx <= zx_max and sy >= zy_min and sy <= zy_max %}
                {% set target_inside = tx >= zx_min and tx <= zx_max and ty >= zy_min and ty <= zy_max %}
                {% set path_overlaps = max_x >= zx_min and min_x <= zx_max and max_y >= zy_min and min_y <= zy_max %}
                {% set high_enough = sz >= z_clear and tz >= z_clear %}
                {% set exiting_zone = start_inside and not target_inside and moving_xy %}
                {% set xy_inside = start_inside and target_inside and moving_xy %}
                {% set allowed = (
                    high_enough and allow_when_above == 1
                ) or (
                    exiting_zone and tz >= sz and allow_exit == 1
                ) or (
                    moving_z_up_only and start_inside and allow_z_lift == 1
                ) or (
                    moving_z_down_only and start_inside and allow_z_lower == 1
                ) or (
                    xy_inside and tz >= sz and allow_xy_inside == 1
                ) %}

                {% if path_overlaps and not allowed %}
                    {% set ns.blocked = 1 %}
                    {% set ns.zone = zone.name|default('zone_' ~ loop.index) %}
                {% endif %}
            {% endif %}
        {% endfor %}

        {% if ns.blocked == 1 %}
            {action_raise_error("Blocked unsafe move through " ~ ns.zone ~ ": from X" ~ sx|round(3) ~ " Y" ~ sy|round(3) ~ " Z" ~ sz|round(3) ~ " to X" ~ tx|round(3) ~ " Y" ~ ty|round(3) ~ " Z" ~ tz|round(3))}
        {% endif %}
    {% endif %}

[gcode_macro _NEEDLE_CORRECTED_MOVE]
description: Internal move wrapper used by G0/G1
gcode:
    {% set base = params.BASE|default("G1.1")|string %}
    {% for key in params %}
        {% if key not in ['BASE', 'X', 'Y', 'Z', 'F'] %}
            {action_raise_error("_NEEDLE_CORRECTED_MOVE does not support parameter " ~ key)}
        {% endif %}
    {% endfor %}
    {% if base not in ['G0.1', 'G1.1'] %}
        {action_raise_error("_NEEDLE_CORRECTED_MOVE BASE must be G0.1 or G1.1")}
    {% endif %}
    {% set needle = printer['gcode_macro _NEEDLE_TIP_OFFSETS'] %}
    {% set svv = printer.save_variables.variables %}
    {% set enabled = needle.enabled|int %}
    {% set absolute = printer.gcode_move.absolute_coordinates %}
    {% set raw_x = params.X|float(none) if params.X is defined else none %}
    {% set raw_y = params.Y|float(none) if params.Y is defined else none %}
    {% set raw_z = params.Z|float(none) if params.Z is defined else none %}
    {% set raw_f = params.F|float(none) if params.F is defined else none %}
    {% if (params.X is defined and raw_x is none) or (params.Y is defined and raw_y is none) or (params.Z is defined and raw_z is none) or (params.F is defined and raw_f is none) %}
        {action_raise_error("G0/G1 XYZ/F parameters must be numeric")}
    {% endif %}
    {% if enabled == 1 and needle.require_tcp_ready|int == 1 and svv.tcp_ready|default(false) != true %}
        {action_raise_error("Needle tip offsets are enabled but the saved TCP calibration is not ready. Run TCPSTART/TCPCALIBRATE first or disable NEEDLE_TIP_OFFSETS.")}
    {% endif %}
    {% set tcp_x = svv.tcp_offset_x|default(0.0)|float(none) if enabled == 1 else 0.0 %}
    {% set tcp_y = svv.tcp_offset_y|default(0.0)|float(none) if enabled == 1 else 0.0 %}
    {% set saved_tcp_z = svv.tcp_offset_z|default(0.0)|float(none) if enabled == 1 else 0.0 %}
    {% set surface_z = needle.surface_z|float(none) if enabled == 1 else 0.0 %}
    {% if enabled == 1 and (tcp_x is none or tcp_y is none or saved_tcp_z is none or surface_z is none) %}
        {action_raise_error("Saved TCP/live-Z offsets must be numeric")}
    {% endif %}
    {% set tcp_z = saved_tcp_z + surface_z %}
    {% set x = raw_x + tcp_x if raw_x is not none and absolute and enabled == 1 else raw_x %}
    {% set y = raw_y + tcp_y if raw_y is not none and absolute and enabled == 1 else raw_y %}
    {% set z = raw_z + tcp_z if raw_z is not none and absolute and enabled == 1 else raw_z %}
    _CHECK_MOVE_SAFETY{% if x is not none %} X={x}{% endif %}{% if y is not none %} Y={y}{% endif %}{% if z is not none %} Z={z}{% endif %}{% if raw_f is not none %} F={raw_f}{% endif %}
    {base}{% if x is not none %} X{x}{% endif %}{% if y is not none %} Y{y}{% endif %}{% if z is not none %} Z{z}{% endif %}{% if raw_f is not none %} F{raw_f}{% endif %}

[gcode_macro G0]
description: Safe rapid move with optional needle-tip TCP/live-Z correction
rename_existing: G0.1
gcode:
    {% for key in params %}
        {% if key not in ['G', 'N', '*', 'X', 'Y', 'Z', 'F'] %}
            {action_raise_error("G0 does not support parameter " ~ key)}
        {% endif %}
    {% endfor %}
    _NEEDLE_CORRECTED_MOVE BASE=G0.1{% if params.X is defined %} X={params.X}{% endif %}{% if params.Y is defined %} Y={params.Y}{% endif %}{% if params.Z is defined %} Z={params.Z}{% endif %}{% if params.F is defined %} F={params.F}{% endif %}

[gcode_macro G1]
description: Safe linear move with optional needle-tip TCP/live-Z correction
rename_existing: G1.1
gcode:
    {% for key in params %}
        {% if key not in ['G', 'N', '*', 'X', 'Y', 'Z', 'F'] %}
            {action_raise_error("G1 does not support parameter " ~ key)}
        {% endif %}
    {% endfor %}
    _NEEDLE_CORRECTED_MOVE BASE=G1.1{% if params.X is defined %} X={params.X}{% endif %}{% if params.Y is defined %} Y={params.Y}{% endif %}{% if params.Z is defined %} Z={params.Z}{% endif %}{% if params.F is defined %} F={params.F}{% endif %}
