# ============================================
# Arduino Valve Timing Bridge
# ============================================
# Valve pulse timing is owned by the Arduino. Continuous spotting uses the Pi
# host-MCU GPIO trigger path: preload timing once over the USB bridge, then make
# every spot a Klipper-queued move plus one SET_PIN trigger edge.
#
# Pi setup:
#   1. Copy scripts/arduino_valve_fire.py to:
#      /home/pi/printer_data/config/scripts/arduino_valve_fire.py
#   2. Wire the Pi trigger GPIOs below to Arduino D2 and D3 and connect Pi/Arduino GND.
#   3. Run scripts/arduino_valve_bridge.py as a persistent Pi service.
#   4. Optional: allow Klipper to start/restart that service through sudoers.
#   5. Install the Klipper gcode_shell_command extension so RUN_SHELL_COMMAND
#      is available.
#
# Current Arduino firmware in this repo drives VALVE=0 on D7 and VALVE=1 on D6.
# Pi host-MCU GPIO17 triggers VALVE=0 through a stable Arduino D2 edge.
# GPIO27 triggers VALVE=1 through a stable Arduino D3 edge.

[output_pin arduino_valve_trigger_0]
# Verify this Raspberry Pi GPIO against your wiring before enabling the macro.
pin: rpi:gpio17
pwm: False
value: 0
shutdown_value: 0

[output_pin arduino_valve_trigger_1]
# Verify this Raspberry Pi GPIO against your wiring before enabling the macro.
pin: rpi:gpio27
pwm: False
value: 0
shutdown_value: 0

[gcode_shell_command arduino_valve_fire]
command: python3 /home/pi/printer_data/config/scripts/arduino_valve_fire.py
timeout: 10.
verbose: True

[gcode_shell_command arduino_valve_configure]
command: python3 /home/pi/printer_data/config/scripts/arduino_valve_fire.py --configure-only
timeout: 2.
verbose: True

[gcode_shell_command arduino_valve_bridge_start]
command: sudo -n /usr/bin/systemctl start spotter-arduino-valve-bridge.service
timeout: 10.
verbose: True

[gcode_shell_command arduino_valve_bridge_restart]
command: sudo -n /usr/bin/systemctl restart spotter-arduino-valve-bridge.service
timeout: 10.
verbose: True

[gcode_macro START_ARDUINO_VALVE_BRIDGE]
description: Start the Pi-side Arduino valve bridge systemd service
gcode:
  RUN_SHELL_COMMAND CMD=arduino_valve_bridge_start

[gcode_macro RESTART_ARDUINO_VALVE_BRIDGE]
description: Restart the Pi-side Arduino valve bridge systemd service
gcode:
  RUN_SHELL_COMMAND CMD=arduino_valve_bridge_restart

[gcode_macro SET_ARDUINO_VALVE_TIMING]
description: Preload Arduino timing used by Pi-MCU edge-triggered shots
gcode:
  {% set valve = params.VALVE|default(0)|int %}
  {% set on_ms = params.ON_MS|default(5)|float %}
  {% set off_ms = params.OFF_MS|default(0)|float %}
  {% set cycles = params.CYCLES|default(1)|int %}

  {% if valve not in [0, 1] %}
    {action_raise_error("Current Arduino bridge pin map supports VALVE=0 and VALVE=1 only")}
  {% endif %}
  {% if on_ms < 2.0 %}
    {action_raise_error("ON_MS must be at least 2.000ms")}
  {% endif %}
  {% if off_ms < 0 %}
    {action_raise_error("OFF_MS must be at least 0ms")}
  {% endif %}
  {% if cycles < 1 %}
    {action_raise_error("CYCLES must be at least 1")}
  {% endif %}

  RUN_SHELL_COMMAND CMD=arduino_valve_configure PARAMS="--valve {valve} --on-ms {on_ms} --off-ms {off_ms} --cycles {cycles}"

[gcode_macro ARDUINO_VALVE_FIRE]
description: Trigger the Arduino valve through Pi MCU GPIO or USB fallback
variable_trigger_mode: "mcu"
variable_trigger_state_0: 0
variable_trigger_state_1: 0
gcode:
  {% set valve = params.VALVE|default(0)|int %}
  {% set on_ms = params.ON_MS|default(5)|float %}
  {% set off_ms = params.OFF_MS|default(0)|float %}
  {% set cycles = params.CYCLES|default(1)|int %}
  {% set trigger_mode = params.TRIGGER_MODE|default(printer["gcode_macro ARDUINO_VALVE_FIRE"].trigger_mode)|lower %}

  {% if valve not in [0, 1] %}
    {action_raise_error("Current Arduino bridge pin map supports VALVE=0 and VALVE=1 only")}
  {% endif %}
  {% if on_ms < 2.0 %}
    {action_raise_error("ON_MS must be at least 2.000ms")}
  {% endif %}
  {% if off_ms < 0 %}
    {action_raise_error("OFF_MS must be at least 0ms")}
  {% endif %}
  {% if cycles < 1 %}
    {action_raise_error("CYCLES must be at least 1")}
  {% endif %}

  {% if trigger_mode == "mcu" %}
    {% if valve == 0 %}
      {% set next_trigger_state = 1 - printer["gcode_macro ARDUINO_VALVE_FIRE"].trigger_state_0|int %}
      SET_GCODE_VARIABLE MACRO=ARDUINO_VALVE_FIRE VARIABLE=trigger_state_0 VALUE={next_trigger_state}
      SET_PIN PIN=arduino_valve_trigger_0 VALUE={next_trigger_state}
    {% else %}
      {% set next_trigger_state = 1 - printer["gcode_macro ARDUINO_VALVE_FIRE"].trigger_state_1|int %}
      SET_GCODE_VARIABLE MACRO=ARDUINO_VALVE_FIRE VARIABLE=trigger_state_1 VALUE={next_trigger_state}
      SET_PIN PIN=arduino_valve_trigger_1 VALUE={next_trigger_state}
    {% endif %}
  {% elif trigger_mode == "usb" %}
    RUN_SHELL_COMMAND CMD=arduino_valve_fire PARAMS="--valve {valve} --on-ms {on_ms} --off-ms {off_ms} --cycles {cycles}"
  {% else %}
    {action_raise_error("TRIGGER_MODE must be mcu or usb")}
  {% endif %}

# ============================================
# Valve Commands
# ============================================
[gcode_macro TEST_ARDUINO_VALVE]
description: Trigger Arduino valve timing without moving
gcode:
  SET_ARDUINO_VALVE_TIMING VALVE={params.VALVE|default(0)|int} ON_MS={params.ON_MS|default(5)|float} OFF_MS={params.OFF_MS|default(0)|float} CYCLES={params.CYCLES|default(1)|int}
  ARDUINO_VALVE_FIRE VALVE={params.VALVE|default(0)|int} ON_MS={params.ON_MS|default(5)|float} OFF_MS={params.OFF_MS|default(0)|float} CYCLES={params.CYCLES|default(1)|int} TRIGGER_MODE=mcu

[gcode_macro VALVE_SET]
description: Current Arduino firmware path supports pulse shots only
gcode:
  {% set state = params.STATE|default(0)|int %}
  {% if state %}
    {action_raise_error("Arduino valve HOLD/VALVE_ON requires updated Arduino firmware")}
  {% else %}
    {action_respond_info("Arduino pulse firmware has no latched off command")}
  {% endif %}

[gcode_macro VALVE_ON]
description: Unsupported with current Arduino firmware
gcode:
  {action_raise_error("Arduino valve HOLD/VALVE_ON requires updated Arduino firmware")}

[gcode_macro VALVE_OFF]
description: No-op for Arduino pulse firmware
gcode:
  {action_respond_info("Arduino pulse firmware has no latched off command")}

# ============================================
# Unified GUI Interface
# ============================================
[gcode_macro SHOOT]
description: Universal shooting command used by the GUI
gcode:
  {% set valve = params.VALVE|default(0)|int %}
  {% set trigger_mode = params.TRIGGER_MODE|default(printer["gcode_macro ARDUINO_VALVE_FIRE"].trigger_mode)|lower %}
  {% set pre_fire_wait = params.PRE_FIRE_WAIT|default(0)|float %}
  {% set hold = params.HOLD|default(0)|int %}
  {% set on_ms = params.ON_MS|default(5)|float %}
  {% set off_ms = params.OFF_MS|default(0)|float %}
  {% set cycles = params.CYCLES|default(1)|int %}
  {% set post_fire_wait = params.POST_FIRE_WAIT|default(0)|float %}
  {% set speed_mm_s = params.SPEED_MM_S|default(50)|float %}

  {% if 'ASYNC' in params %}
    {action_raise_error("ASYNC is removed; use PRE/POST waits for timing")}
  {% endif %}
  {% if speed_mm_s <= 0 %}
    {action_raise_error("SPEED_MM_S must be greater than 0")}
  {% endif %}


  {% if 'X' in params or 'Y' in params %}
    {% set x = params.X|default(printer.toolhead.position.x)|float %}
    {% set y = params.Y|default(printer.toolhead.position.y)|float %}
    G1 X{x} Y{y} F{speed_mm_s * 60}
  {% endif %}

  {% if pre_fire_wait > 0 %}
    G4 P{pre_fire_wait}
  {% endif %}

  ARDUINO_VALVE_FIRE VALVE={valve} ON_MS={on_ms} OFF_MS={off_ms} CYCLES={cycles} TRIGGER_MODE={trigger_mode}

  {% if post_fire_wait > 0 %}
    G4 P{post_fire_wait}
  {% endif %}

# ============================================
# Testing
# ============================================
[gcode_macro TEST_CONTINUOUS_SHOOT]
description: queue motion and trigger without pre/post waits
gcode:
  G1 X0
  SET_ARDUINO_VALVE_TIMING VALVE=0 ON_MS=5 OFF_MS=5 CYCLES=1
  SHOOT VALVE=0 X=20 Y={printer.toolhead.position.y} SPEED_MM_S=50 PRE_FIRE_WAIT=0 POST_FIRE_WAIT=0 TRIGGER_MODE=mcu
  G1 X40

[gcode_macro TEST_DELAYED_SHOOT]
description: queue motion and trigger with explicit pre/post waits
gcode:
  G1 X0
  SET_ARDUINO_VALVE_TIMING VALVE=0 ON_MS=5 OFF_MS=5 CYCLES=1
  SHOOT VALVE=0 X=20 Y={printer.toolhead.position.y} SPEED_MM_S=50 PRE_FIRE_WAIT=20 POST_FIRE_WAIT=20 TRIGGER_MODE=mcu
  G1 X40

[gcode_macro EMERGENCY_VALVE_OFF]
description: No-op for Arduino pulse firmware
gcode:
  {action_respond_info("Arduino pulse firmware has no latched off command")}
