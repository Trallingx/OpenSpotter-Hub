[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: !PC3
position_min: -5
position_endstop: -5
position_max: 235
homing_speed: 50
homing_retract_dist: 20

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
run_current: 0.200
stealthchop_threshold: 999999
uart_address: 0

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: PC15
position_min: -2
position_endstop: -2
position_max: 235
homing_speed: 50
homing_retract_dist: 20

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.200
stealthchop_threshold: 999999


[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: PC13
position_endstop: 0.0
position_min: -1.0
position_max: 250
homing_retract_dist: 20

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.250
stealthchop_threshold: 999999

[manual_stepper r2r_rewind]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 8
endstop_pin: !PC0
position_endstop: 0.0
position_min: -1.0
position_max: 250
homing_retract_dist: 20

[tmc2209 manual_stepper r2r_rewind]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.600
stealthchop_threshold: 999999

[gcode_macro MOVE_R2R_FORWARD]
gcode:
    MANUAL_STEPPER STEPPER=r2r_rewind ENABLE=1 MOVE=10

[gcode_macro MOVE_R2R_BACKWARD]
gcode:
    MANUAL_STEPPER STEPPER=r2r_rewind ENABLE=1 MOVE=-10

[gcode_macro STOP_R2R_STEPPER]
gcode:
    MANUAL_STEPPER STEPPER=r2r_rewind ENABLE=0

[gcode_macro SET_HOMED]
gcode:
    SET_KINEMATIC_POSITION X=0 Y=0 Z=0 
