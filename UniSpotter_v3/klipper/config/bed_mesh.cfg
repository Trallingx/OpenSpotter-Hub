# =============================================================================
# Bed Mesh Leveling Configuration
# Default values here are only fallback — always use MESH macro at runtime.
# Mesh is always referenced to NOZZLE TIP because Klipper automatically
# compensates for bltouch x_offset/y_offset during probing.
# =============================================================================

[bed_mesh]
speed: 50
horizontal_move_z: 5
mesh_min: 27, 25
mesh_max: 190, 190
probe_count: 10
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 0.6
fade_end: 10
fade_target: 0

# =============================================================================
# Mesh Macros — configurable square mesh region at runtime
# =============================================================================
# Usage:
#   MESH                                                  full bed 5x5
#   MESH X_MIN=20 Y_MIN=20 X_MAX=180 Y_MAX=180 POINTS=5  custom region
#   MESH X_MIN=50 Y_MIN=50 X_MAX=150 Y_MAX=150 POINTS=7  dense small area
#
# POINTS sets both X and Y count (square grid). Clamped 2-10.
# Each completed mesh is auto-saved as a named profile for later recall.
# Mesh is always mapped to nozzle tip — no manual offset math required.
# =============================================================================

[gcode_macro MESH]
description: Probe a configurable square bed mesh. Args: X_MIN Y_MIN X_MAX Y_MAX POINTS
gcode:
    {% set x_min = params.X_MIN|default(23)|float %}
    {% set x_max = params.X_MAX|default(240)|float %}
    {% set y_min = params.Y_MIN|default(-3)|float %}
    {% set y_max = params.Y_MAX|default(200)|float %}
    {% set pts   = params.POINTS|default(5)|int %}
    {% set pts   = [[pts, 2]|max, 10]|min %}
    {% set pname = "mesh_" ~ x_min|int ~ "_" ~ y_min|int ~ "_" ~ x_max|int ~ "_" ~ y_max|int ~ "_" ~ pts ~ "x" ~ pts %}

    RESPOND MSG="Mesh: X[{x_min},{x_max}] Y[{y_min},{y_max}] Grid={pts}x{pts}"
    M117 Meshing {pts}x{pts}...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE MESH_MIN={x_min},{y_min} MESH_MAX={x_max},{y_max} PROBE_COUNT={pts},{pts}
    BED_MESH_PROFILE SAVE={pname}
    M117 Mesh done
    RESPOND MSG="Saved profile: {pname}"

[gcode_macro MESH_LOAD]
description: Load a saved mesh profile. Usage: MESH_LOAD PROFILE=name
gcode:
    {% set profile = params.PROFILE|default("default")|string %}
    BED_MESH_PROFILE LOAD={profile}
    M117 Mesh: {profile}
    RESPOND MSG="Loaded mesh: {profile}"

[gcode_macro MESH_CLEAR]
description: Clear active mesh compensation
gcode:
    BED_MESH_CLEAR
    M117 Mesh cleared
