# =============================================================================
# Main Klipper Configuration File
# Einsy RAMBo 1.1a - Prusa MK3 Frame with Syringe Extruder
# =============================================================================
# This file includes all modular configuration files
# Edit individual files in the config directory for specific settings
# =============================================================================

[include hardware.cfg]          # Hardware pins and basic stepper config
[include tmc2130.cfg]            # TMC2130 driver configuration
[include syringe.cfg]            # Syringe extruder and endstop
[include bltouch.cfg]            # BLTouch probe configuration
[include bed_mesh.cfg]           # Bed mesh and leveling
[include display.cfg]            # LCD display and buttons
[include start_end.cfg]          # Start and end print macros
[include mainsails.cfg]          # Mainsail

# =============================================================================
# MCU Configuration
# =============================================================================
[mcu]
serial: /dev/serial0
restart_method: command

# =============================================================================
# Printer Kinematics
# =============================================================================
[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 1500
max_z_velocity: 20
max_z_accel: 1500
square_corner_velocity: 5.0


# =============================================================================
# System Features
# =============================================================================
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[respond]
default_type: echo

[force_move]
enable_force_move: True

[save_variables]
filename: ~/printer_data/config/saved_vars.cfg

