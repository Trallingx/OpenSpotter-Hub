# =============================================================================
# Hardware Configuration - Stepper Motors
# Einsy RAMBo 1.1a Pin Assignments
# =============================================================================

# =============================================================================
# X AXIS
# =============================================================================
[stepper_x]
step_pin: PC0
dir_pin: !PL0
enable_pin: !PA7
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 250
homing_speed: 50
homing_retract_dist: 0

# =============================================================================
# Y AXIS
# =============================================================================
[stepper_y]
step_pin: PC1
dir_pin: PL1
enable_pin: !PA6
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_endstop: -4
position_min: -4
position_max: 220
homing_speed: 50
homing_retract_dist: 0

# =============================================================================
# Z AXIS
# =============================================================================
[stepper_z]
step_pin: PC2
dir_pin: !PL2
enable_pin: !PA5
microsteps: 16
rotation_distance: 8
endstop_pin: tmc2130_stepper_z:virtual_endstop
position_endstop: 104
position_max: 120
position_min: -20
homing_positive_dir: true
homing_speed: 20
homing_retract_dist: 0





