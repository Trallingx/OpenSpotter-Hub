# =============================================================================
# Start and End Print Macros
# =============================================================================

[gcode_macro START_PRINT]
description: Home, mesh, prime syringe. Args: X_MIN Y_MIN X_MAX Y_MAX POINTS
gcode:
    {% set x_min    = params.X_MIN|default(10)|float %}
    {% set y_min    = params.Y_MIN|default(10)|float %}
    {% set x_max    = params.X_MAX|default(240)|float %}
    {% set y_max    = params.Y_MAX|default(200)|float %}
    {% set pts      = params.POINTS|default(5)|int %}

    RESPOND MSG="=== START PRINT ==="
    G90                                     # Absolute positioning
    M82                                     # Absolute extrusion
    G28                                     # Home all axes
    MESH X_MIN={x_min} Y_MIN={y_min} X_MAX={x_max} Y_MAX={y_max} POINTS={pts}
    G1 Z5 F3000                             # Lift Z
    HOME_SYRINGE                            # Home syringe to full
    SYRINGE_PRIME                           # Prime tip
    M117 Ready to dispense

[gcode_macro END_PRINT]
description: Retract, park, disable motors
gcode:
    RETRACT_SYRINGE VOLUME=0.5              # Anti-drip retract
    G91                                     # Relative positioning
    G1 Z10 F3000                            # Raise Z 10mm
    G90                                     # Absolute positioning
    G1 X0 Y200 F3000                        # Park at front
    M84                                     # Disable motors
    M117 Done
    RESPOND MSG="=== END PRINT ==="

[gcode_macro Z_SMASH_ALIGN]
description: Mechanical gantry alignment by crashing into top frame
gcode:
    
    M117 Gantry Align...

    # Home all axes normally
    G28

    # Move to the very top (should already be there after homing)
    G0 Z100 F600
    G0 X110 F2000

    # Disable stall detection temporarily (prevents retrigger)
    SET_TMC_FIELD STEPPER=stepper_z FIELD=SGT VALUE=0

    # Push 5mm further into the top frame
    G91
    G1 Z5 F300
    G90

    # Small pause to let motors settle
    G4 P500

    # Restore stall sensitivity (adjust if needed)
    SET_TMC_FIELD STEPPER=stepper_z FIELD=SGT VALUE=4

    # Re-home Z cleanly
    G28 Z

    M117 Gantry Aligned