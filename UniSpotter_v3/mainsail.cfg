# WARNING: DO NOT EDIT THIS FILE UNLESS YOU KNOW WHAT YOU ARE DOING

[output_pin LCD_backlight_pin]
pin: PE3
pwm: True
hardware_pwm: True

value: 0.1       # 1% of backlight
shutdown_value: 1 # Back to full backlight (without PWM) on restart
cycle_time: 0.001 # Default 0.1s cycle time flickers as hell

[display]
lcd_type: hd44780
rs_pin: PD5
e_pin: PF7
d4_pin: PF5
d5_pin: PG4
d6_pin: PH7
d7_pin: PG3
encoder_pins: ^PJ1,^PJ2
click_pin: ^!PH6


; Simplified PAUSE/RESUME for MK3+ LCD: no parking, no checks, just pause/resume in place.

[gcode_macro PAUSE]
description: Pause without parking; stay put
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE

[gcode_macro RESUME]
description: Resume immediately from LCD button
rename_existing: RESUME_BASE
gcode:
  RESUME_BASE
  